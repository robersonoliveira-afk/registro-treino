<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0B4F55">
<title>Registro de treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   1. Tokens
   ===================================================================== */
:root {
  color-scheme: light;
  /* Paleta: verde-azulado (cor principal, texto), coral (ação e alerta), âmbar (destaque).
     Os nomes antigos das variáveis ficaram para não mexer no resto do código. */
  --papel: #F2F6F6;
  --cartao: #FFFFFF;
  --oliva: #0B4F55;
  --terra: #C4461F;
  --mostarda: #E9A23B;
  --texto-sec: #4E6569;
  --linha: rgba(11, 79, 85, 0.15);
  --oliva-fundo: rgba(11, 79, 85, 0.07);
  --terra-fundo: rgba(196, 70, 31, 0.09);
  --mostarda-fundo: rgba(233, 162, 59, 0.20);

  --titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
  --texto: 'IBM Plex Sans', system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Roboto Mono', Menlo, Consolas, monospace;

  --raio: 10px;
  --toque: 44px;
}

/* =====================================================================
   2. Base e tipografia
   ===================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--oliva);
  font: 17px/1.45 var(--texto);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body[data-tela="treino"] { padding-bottom: 24px; }
main { max-width: 520px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3, h4 { font-family: var(--titulo); font-weight: 600; margin: 0; line-height: 1.2; }
h4 { font-size: 15px; }
h1 { font-size: 27px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sec-txt { color: var(--texto-sec); }
.peq { font-size: 14px; }
.alerta-txt { color: var(--terra); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--mostarda); outline-offset: 2px; }

.topo { padding: 20px 0 12px; }
.topo .data { color: var(--texto-sec); margin-top: 2px; }
.secao-titulo { margin: 28px 0 10px; }

/* =====================================================================
   3. Componentes
   ===================================================================== */
.cartao {
  background: var(--cartao);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  padding: 16px;
  margin-bottom: 12px;
}
.cartao.alerta { border-color: var(--terra); background: var(--terra-fundo); }
.cartao.ok { border-color: var(--oliva); background: var(--oliva-fundo); }
.cartao > * + * { margin-top: 10px; }

.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--toque); padding: 0 18px;
  border: 2px solid var(--oliva); border-radius: var(--raio);
  background: var(--oliva); color: var(--papel);
  font-weight: 600; text-decoration: none;
}
.botao.sec { background: transparent; color: var(--oliva); }
.botao.terra { background: var(--terra); border-color: var(--terra); color: #fff; }
.botao.terra.sec { background: transparent; color: var(--terra); }
.botao.grande { width: 100%; min-height: 56px; font-size: 19px; }
.botao.cheio { width: 100%; }
.botao:disabled { opacity: .45; }
.link {
  background: none; border: 0; padding: 8px 0; min-height: var(--toque);
  color: var(--oliva); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}
.link.terra { color: var(--terra); }

.acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.acoes > .botao { flex: 1 1 0; }

/* Chips (escolha única) */
.chips { display: flex; gap: 8px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
.chips legend { font-size: 14px; color: var(--texto-sec); padding: 0; margin-bottom: 6px; }
.chip {
  min-height: 40px; min-width: 44px; padding: 0 14px;
  border: 1.5px solid var(--oliva); border-radius: 999px;
  background: transparent; color: var(--oliva); font-weight: 500; white-space: nowrap;
}
.chip.sel { background: var(--oliva); color: var(--papel); }
label.chip-radio { position: relative; }
label.chip-radio input { position: absolute; opacity: 0; pointer-events: none; }
label.chip-radio span {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px;
  border: 1.5px solid var(--oliva); border-radius: 999px; font-weight: 500;
}
label.chip-radio input:checked + span { background: var(--oliva); color: var(--papel); }
label.chip-radio input:focus-visible + span { outline: 3px solid var(--mostarda); outline-offset: 2px; }

/* Seletor A/B */
.alternador { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.alternador button {
  min-height: 56px; border: 2px solid var(--oliva); border-radius: var(--raio);
  background: transparent; font-family: var(--titulo); font-size: 22px; font-weight: 600;
}
.alternador button.sel { background: var(--oliva); color: var(--papel); }
.alternador small { display: block; font: 500 12px var(--texto); }

/* Barra de progresso */
.barra { height: 10px; background: var(--mostarda-fundo); border-radius: 999px; overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--mostarda); border-radius: 999px; }

/* Formulários */
.campo { display: block; }
.campo > span { display: block; font-size: 14px; color: var(--texto-sec); margin-bottom: 4px; }
.campo input, .campo select, .campo textarea, select.solto {
  width: 100%; min-height: var(--toque); padding: 8px 12px;
  border: 1.5px solid var(--linha); border-radius: 8px; background: #fff;
}
.campo input:focus, .campo select:focus, select.solto:focus { border-color: var(--oliva); outline: none; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.erro { color: var(--terra); font-weight: 500; }

/* Medidas: campo + referência da semana anterior */
.medida-linha { display: grid; grid-template-columns: 1fr 104px 76px; gap: 8px; align-items: center; }
.medida-linha input {
  width: 100%; min-height: var(--toque); padding: 6px 10px; text-align: right;
  border: 1.5px solid var(--linha); border-radius: 8px; background: #fff; font-family: var(--mono);
}
.medida-linha input:focus { border-color: var(--oliva); outline: none; }
.medida-linha .ref { font-size: 13px; color: var(--texto-sec); text-align: right; }
.medida-linha .ref b { font-family: var(--mono); font-weight: 500; display: block; color: var(--oliva); }

/* Confirmação na própria página */
.confirmacao { border: 2px solid var(--terra); border-radius: var(--raio); padding: 14px; background: var(--terra-fundo); }
.confirmacao p { margin-bottom: 10px; }

/* Mensagem rápida */
.flash { display: flex; gap: 10px; align-items: center; justify-content: space-between;
  padding: 10px 14px; margin: 0 0 12px; border-radius: var(--raio);
  background: var(--oliva-fundo); border-left: 4px solid var(--oliva); }
.flash.alerta { background: var(--terra-fundo); border-left-color: var(--terra); }
.flash .link { padding: 0; min-height: 0; }

/* Navegação inferior */
nav.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--papel); border-top: 1px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.abas button {
  min-height: 60px; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--texto-sec);
  border-top: 3px solid transparent;
}
nav.abas button.ativo { color: var(--oliva); font-weight: 600; border-top-color: var(--oliva); }
body[data-tela="treino"] nav.abas { display: none; }

/* =====================================================================
   4. Treino em andamento
   ===================================================================== */
.barra-treino {
  position: sticky; top: 0; z-index: 5;
  margin: 0 -16px 12px; padding: 8px 16px 10px;
  background: var(--papel); border-bottom: 1px solid var(--linha);
}
.barra-treino .linha1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.barra-treino .linha1 strong { font-family: var(--titulo); font-size: 20px; }
.descanso { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.descanso .chip { min-height: 36px; padding: 0 10px; font-size: 15px; }
.descanso .cron { margin-left: auto; font-size: 26px; font-weight: 600; min-width: 84px; text-align: right; }
.descanso .cron.fim { color: var(--terra); font-size: 16px; font-family: var(--texto); }
.descanso .botao { min-height: 40px; padding: 0 12px; }

.exercicio .ex-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.exercicio .faixa { font-size: 14px; color: var(--texto-sec); white-space: nowrap; }
.exercicio .ref { font-size: 15px; color: var(--texto-sec); }
.exercicio .ref .num { color: var(--oliva); }
.subir { color: var(--terra); font-size: 15px; font-weight: 500; }
.selo { display: inline-block; padding: 2px 10px; margin-right: 6px; border-radius: 999px;
  background: var(--terra); color: #fff; font-weight: 600; font-size: 14px; }

.series-cab { display: grid; grid-template-columns: 20px 1fr 1fr; gap: 8px; font-size: 13px; color: var(--texto-sec); }
.serie {
  display: grid; gap: 8px; align-items: center;
  grid-template-columns: 20px 1fr 1fr;
  grid-template-areas: "n kg reps" "folga folga feita";
  padding: 10px 8px; margin: 0 -8px; border-radius: 8px;
}
.serie + .serie { border-top: 1px solid var(--linha); }
.serie.feita { background: var(--oliva-fundo); }
.serie .n { grid-area: n; font-weight: 600; text-align: center; }
.serie .st-kg { grid-area: kg; }
.serie .st-reps { grid-area: reps; }
.serie .folga { grid-area: folga; display: flex; align-items: center; gap: 4px; }
.serie .folga .rot { font-size: 13px; color: var(--texto-sec); margin-right: 2px; }
.serie .folga .chip { min-width: 30px; min-height: 36px; padding: 0; font-family: var(--mono); }
.serie .concluir { grid-area: feita; min-height: 46px; padding: 0 8px; }
.serie.sem-carga { grid-template-areas: "n reps feita"; }
.selo.principal { background: var(--oliva); font-size: 12px; padding: 1px 8px; vertical-align: 2px; }
.fase { font-size: 14px; color: var(--texto-sec); }
.fase b { color: var(--terra); font-weight: 600; }

/* Plano do dia e escolha de perfil */
.dia-lista { margin: 0; padding: 0; list-style: none; }
.dia-lista li { padding: 4px 0; font-weight: 500; }
.semana-tab { width: 100%; border-collapse: collapse; font-size: 15px; }
.semana-tab td { padding: 6px 4px; border-top: 1px solid var(--linha); vertical-align: top; }
.semana-tab td:first-child { font-family: var(--mono); color: var(--texto-sec); width: 44px; }
.semana-tab tr.hoje td { font-weight: 600; color: var(--terra); }
.perfil-opcao { display: block; width: 100%; text-align: left; padding: 16px; margin-bottom: 12px;
  border: 2px solid var(--oliva); border-radius: var(--raio); background: var(--cartao); }
.perfil-opcao strong { display: block; font-family: var(--titulo); font-size: 20px; }
.perfil-opcao span { color: var(--texto-sec); font-size: 15px; }
body[data-tela="escolha"] nav.abas { display: none; }

.stepper { display: grid; grid-template-columns: 40px 1fr 40px; height: var(--toque);
  border: 1.5px solid var(--oliva); border-radius: 8px; overflow: hidden; background: #fff; }
.stepper button { border: 0; background: var(--oliva-fundo); font-size: 22px; font-weight: 600; }
.stepper button:active { background: var(--linha); }
.stepper input { width: 100%; min-width: 0; border: 0; text-align: center; font-family: var(--mono);
  font-size: 18px; font-weight: 600; background: transparent; }
.stepper input:focus { outline: none; background: var(--mostarda-fundo); }

.fim-treino > * + * { margin-top: 10px; }

/* Tela "Ver treino" e figura de músculos */
.plano-linha { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
.plano-info > * + * { margin-top: 4px; }
.figura { display: block; width: 96px; height: auto; }
.figura .corpo { fill: #DCE5E5; }
.figura .mn { fill: rgba(11, 79, 85, 0.10); }
.figura .mp, .ponto-cor.mp { fill: var(--terra); background: var(--terra); }
.figura .ms, .ponto-cor.ms { fill: var(--mostarda); background: var(--mostarda); }
.figura text { font: 8px var(--texto); fill: var(--texto-sec); }
.ponto-cor { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
.dica { font-size: 15px; border-left: 3px solid var(--mostarda); padding-left: 10px; }

/* =====================================================================
   5. Progresso e gráficos
   ===================================================================== */
.contador { display: flex; align-items: baseline; gap: 8px; }
.contador .grande { font-family: var(--mono); font-size: 44px; font-weight: 600; line-height: 1; }
.resumo-medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.resumo-medidas .rot { font-size: 14px; color: var(--texto-sec); }
.resumo-medidas .val { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.resumo-medidas .dif { font-family: var(--mono); font-size: 14px; color: var(--texto-sec); }

.graf-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.graf-cab .val { font-family: var(--mono); font-weight: 600; }
.grafico { display: block; width: 100%; height: auto; touch-action: manipulation; }
.grafico .grade { stroke: var(--linha); stroke-width: 1; }
.grafico .eixo { font: 10px var(--mono); fill: var(--texto-sec); }
.grafico .meta { stroke: var(--mostarda); stroke-width: 2; stroke-dasharray: 5 4; }
.grafico .meta-rot { font: 600 10px var(--texto); fill: var(--texto-sec); }
.grafico .linha { fill: none; stroke: var(--oliva); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.grafico .ponto { fill: var(--oliva); stroke: var(--cartao); stroke-width: 2; }
.grafico .ponto.suave { fill: var(--oliva); fill-opacity: .35; stroke: none; }
.grafico .ponto.ativo { fill: var(--terra); fill-opacity: 1; stroke: var(--cartao); stroke-width: 2; }
.grafico .alvo { fill: transparent; }
.leitura { font-size: 14px; color: var(--texto-sec); min-height: 20px; }
.leitura b { font-family: var(--mono); font-weight: 500; color: var(--oliva); }
.legenda { display: flex; gap: 14px; font-size: 13px; color: var(--texto-sec); }
.legenda i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--oliva); vertical-align: middle; margin-right: 4px; }
.legenda i.pt { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--oliva); opacity: .35; }
.legenda i.mt { border-top: 2px dashed var(--mostarda); }
.nota { font-size: 13px; color: var(--texto-sec); margin: 8px 0 16px; }
.vazio { color: var(--texto-sec); font-size: 15px; }

/* =====================================================================
   6. Histórico e configurações
   ===================================================================== */
.filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.filtros .chip { flex: none; }
.reg { padding: 0; }
.reg > * + * { margin-top: 0; }
.reg-cab { display: grid; grid-template-columns: 86px 1fr; gap: 2px 10px; width: 100%;
  padding: 14px 16px; border: 0; background: none; text-align: left; }
.reg-cab .d { grid-row: span 2; font-family: var(--mono); font-size: 14px; color: var(--texto-sec); padding-top: 2px; }
.reg-cab .t { font-weight: 600; }
.reg-cab .s { font-size: 14px; color: var(--texto-sec); }
.reg-corpo { padding: 0 16px 16px; }
.reg-corpo > * + * { margin-top: 10px; }
.reg-corpo ul { margin: 0; padding: 0; list-style: none; }
.reg-corpo li { padding: 6px 0; border-top: 1px solid var(--linha); font-size: 15px; }
.reg-corpo li .num { display: block; }

.ex-linha { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--linha); }
.ex-linha:first-of-type { border-top: 0; }
.ex-linha .info { flex: 1; min-width: 0; }
.ex-linha .info .s { font-size: 14px; color: var(--texto-sec); }
.ex-linha .seta { width: 40px; min-height: 40px; border: 1.5px solid var(--linha); border-radius: 8px; background: none; font-size: 16px; }
.ex-linha .seta:disabled { opacity: .3; }

.rodape { font-size: 13px; color: var(--texto-sec); margin: 24px 0; }
</style>
</head>
<body data-tela="hoje">
<main id="app" aria-live="polite"></main>

<nav class="abas" aria-label="Telas">
  <button data-acao="ir" data-tela="hoje">Hoje</button>
  <button data-acao="ir" data-tela="progresso">Progresso</button>
  <button data-acao="ir" data-tela="historico">Histórico</button>
  <button data-acao="ir" data-tela="config">Config</button>
</nav>

<input type="file" id="arquivo-import" accept=".json,application/json" hidden>

<script>
'use strict';

/* =====================================================================
   1. Constantes e plano inicial
   ===================================================================== */
const CHAVE_PERFIL = 'registro-treino-perfil';
const VERSAO_DADOS = 1;
const VERSAO_APP = '1.2.0';
const META_CINTURA = 90;
const META_RCA = 0.5;
const META_VISCERAL = 9;
const DIAS_ALERTA_BACKUP = 7;

// id, nome, treino (A, B ou AB = nos dois), séries, passo de carga, variações, ordem
const EXERCICIOS_P1 = [
  exercicio('leg-press', 'Leg press', 'A', 3, 2.5, [], 1),
  exercicio('supino-maquina', 'Supino máquina', 'A', 3, 2.5, [], 2),
  exercicio('remada-baixa', 'Remada baixa', 'A', 3, 2.5, [], 3),
  exercicio('flexora', 'Flexora', 'A', 3, 2.5, ['Mesa', 'Cadeira'], 4),
  exercicio('rosca-alternada', 'Rosca alternada', 'A', 3, 1, [], 5),
  exercicio('agachamento-goblet', 'Agachamento goblet', 'B', 3, 2.5, [], 1),
  exercicio('puxada-alta', 'Puxada alta', 'B', 3, 2.5, [], 2),
  exercicio('banco-lombar', 'Banco de lombar 45°', 'B', 3, 2.5, [], 3),
  exercicio('cadeira-extensora', 'Cadeira extensora', 'B', 3, 2.5, [], 4),
  exercicio('rosca-b', 'Rosca direta ou martelo', 'B', 3, 1, ['Direta', 'Martelo'], 5),
  exercicio('panturrilha', 'Panturrilha', 'AB', 2, 1, [], 101),
];

function exercicio(id, nome, treino, series, passoKg, variacoes, ordem) {
  return { id, nome, treino, series, repMin: 8, repMax: 12, passoKg, variacoes, ordem, ativo: true };
}

// Plano 1-2-3: as fases sobem a carga sozinhas, contadas a partir do início do plano
const FASES_PRINCIPAL = [
  { semana: 1, series: 3, repMin: 8, repMax: 10 },
  { semana: 5, series: 4, repMin: 6, repMax: 8 },
  { semana: 9, series: 4, repMin: 5, repMax: 6 },
];
const FASES_SALTOS = [
  { semana: 1, series: 3, repMin: 10, repMax: 10 },
  { semana: 3, series: 4, repMin: 10, repMax: 10 },
  { semana: 5, series: 5, repMin: 10, repMax: 10 },
];
// id, nome, treino (1, 2, 3 ou AB = em todos), séries, rep mín., rep máx., passo, ordem, extras
function ex2(id, nome, treino, series, repMin, repMax, passoKg, ordem, extra = {}) {
  return { id, nome, treino, series, repMin, repMax, passoKg, variacoes: [], ordem, ativo: true, ...extra };
}
const EXERCICIOS_P2 = [
  ex2('saltos', 'Saltos', 'AB', 3, 10, 10, 1, 0, { semCarga: true, fases: FASES_SALTOS, ativo: false }),
  ex2('hack', 'Hack articulado', '1', 3, 8, 10, 2.5, 1, { principal: true, fases: FASES_PRINCIPAL }),
  ex2('supino-reto-halteres', 'Supino reto com halteres', '1', 3, 8, 10, 1, 2),
  ex2('remada-curvada', 'Remada curvada pronada', '1', 3, 8, 10, 1, 3),
  ex2('afundo', 'Afundo ou subida no banco', '1', 3, 8, 10, 1, 4, { variacoes: ['Afundo', 'Subida no banco'] }),
  ex2('panturrilha', 'Panturrilha', '1', 3, 10, 12, 2.5, 5),
  ex2('prancha', 'Prancha', '1', 3, 20, 40, 1, 6, { semCarga: true, un: 's' }),
  ex2('stiff', 'Stiff com barra', '2', 3, 8, 10, 2, 1, { principal: true, fases: FASES_PRINCIPAL }),
  ex2('elevacao-pelvica', 'Elevação pélvica com barra', '2', 4, 6, 10, 2.5, 2),
  ex2('agachamento-goblet', 'Agachamento goblet', '2', 3, 8, 10, 1, 3),

let avisoArmazenamento = null;
let erroSalvar = false;

function carregar() {
  let bruto = null;
  try {
    bruto = localStorage.getItem(PERFIL.chave);
  } catch (e) {
    avisoArmazenamento = 'O navegador bloqueou o armazenamento local. Nada será salvo neste aparelho.';
    return estadoInicial();
  }
  if (!bruto) return estadoInicial();
  try {
    return migrar(JSON.parse(bruto), true);
  } catch (e) {
    // Nunca sobrescreve dados ilegíveis: guarda uma cópia antes de recomeçar.
    try { localStorage.setItem(PERFIL.chave + '-ilegivel-' + Date.now(), bruto); } catch (_) {}
    avisoArmazenamento = 'Os dados salvos estavam ilegíveis. Guardei uma cópia e recomecei. Importe o último backup em Config.';
    return estadoInicial();
  }
}

function salvar() {

// Valida e completa os dados (vale para o localStorage e para o arquivo importado).
function migrar(d, manterRascunho) {
  if (!d || typeof d !== 'object') throw new Error('o arquivo não tem dados.');
  if (!Array.isArray(d.exercicios) || !Array.isArray(d.sessoes)) {
    throw new Error('o arquivo não parece um backup deste app.');
  }
  // Backups antigos não têm perfil: são do Plano A/B
  const perfilDoArquivo = PERFIS[d.perfil] ? d.perfil : 'p1';
  if (perfilDoArquivo !== perfilId) {
    throw new Error(`este backup é do ${PERFIS[perfilDoArquivo].rotulo}, e este aparelho está no ${PERFIL.rotulo}.`);
  }
  const base = estadoInicial();
  const dataOk = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const treinosOk = [...PERFIL.treinos, 'AB'];
  const fasesOk = f => Array.isArray(f) && f.length ? f.map(x => ({
    semana: inteiro(x.semana, 1), series: inteiro(x.series, 3), repMin: inteiro(x.repMin, 8), repMax: inteiro(x.repMax, 12),
  })) : undefined;
  // Marcas de aulas: backups antigos guardavam só o Pilates, numa lista própria
  const marcasBrutas = d.marcas && typeof d.marcas === 'object' ? d.marcas : { pilates: d.pilates || [] };
  const marcas = marcasVazias();
  Object.keys(marcas).forEach(k => { marcas[k] = [...new Set((marcasBrutas[k] || []).filter(dataOk))].sort(); });
  return {
    versao: VERSAO_DADOS,
    perfil: perfilId,
    exercicios: d.exercicios.map((e, i) => ({
      id: String(e.id),
      nome: String(e.nome ?? e.id),
      treino: treinosOk.includes(String(e.treino)) ? String(e.treino) : PERFIL.treinos[0],
      series: inteiro(e.series, 3),
      repMin: inteiro(e.repMin, 8),
      repMax: inteiro(e.repMax, 12),
      passoKg: numero(e.passoKg, 2.5),
      variacoes: Array.isArray(e.variacoes) ? e.variacoes.map(String) : [],
      ordem: numero(e.ordem, i + 1),
      ativo: e.ativo !== false,
      semCarga: e.semCarga === true || undefined,
      un: ['s', 'm'].includes(e.un) ? e.un : undefined,
      principal: e.principal === true || undefined,
      fases: fasesOk(e.fases),
    })),
    sessoes: d.sessoes.filter(s => dataOk(s.data)).map((s, i) => ({
      id: String(s.id ?? `${s.data}-${i}`),
      data: s.data,
      treino: PERFIL.treinos.includes(String(s.treino)) ? String(s.treino) : PERFIL.treinos[0],
      criadaEm: numero(s.criadaEm, i),
      itens: (s.itens || []).map(it => ({
        exercicioId: String(it.exercicioId),
        nome: String(it.nome ?? it.exercicioId),
        variacao: it.variacao ?? null,
        series: (it.series || []).map(se => ({
          kg: numero(se.kg, 0),
          reps: inteiro(se.reps, 0),
          folga: se.folga == null ? null : inteiro(se.folga, 0),
        })),
      })),
    })),
    corridas: (d.corridas || []).filter(c => dataOk(c.data)).map(c => ({
      id: String(c.id ?? novoId('c')),
      data: c.data,
      min: numero(c.min, 0),
      formato: c.formato === 'continua' ? 'continua' : 'alternada',
      obs: String(c.obs ?? ''),
    })),
    marcas,
    medidas: (d.medidas || []).filter(m => dataOk(m.data)).map(m => ({
      id: String(m.id ?? novoId('m')),
      data: m.data,
      energia: numeroOuNulo(m.energia),
      pesoKg: numeroOuNulo(m.pesoKg),
      gorduraPct: numeroOuNulo(m.gorduraPct),
      visceral: numeroOuNulo(m.visceral),
      musculoKg: numeroOuNulo(m.musculoKg),
      cinturaCm: numeroOuNulo(m.cinturaCm),
      obs: String(m.obs ?? ''),
    })),
    config: { ...base.config, ...(d.config || {}) },
    ultimoBackup: d.ultimoBackup ?? null,
    rascunho: manterRascunho ? (d.rascunho ?? null) : null,
  };
}

function inteiro(v, padrao) { const n = parseInt(v, 10); return Number.isFinite(n) ? n : padrao; }
function numero(v, padrao) { const n = Number(v); return Number.isFinite(n) ? n : padrao; }
function numeroOuNulo(v) { if (v === null || v === undefined || v === '') return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function novoId(prefixo) { return prefixo + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* =====================================================================
   3. Datas e números (datas sempre no fuso local, como 'AAAA-MM-DD')
   ===================================================================== */
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function hojeISO() { return iso(new Date()); }
function deISO(s) { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); }
function somarDias(s, n) { const d = deISO(s); d.setDate(d.getDate() + n); return iso(d); }
function difDias(a, b) { return Math.round((deISO(b) - deISO(a)) / 864e5); }
function diaDaSemana(s) { return deISO(s).getDay(); }
function segundaDaSemana(s) { const dow = diaDaSemana(s); return somarDias(s, dow === 0 ? -6 : 1 - dow); }

function fmtData(s) {
  const d = deISO(s);
  const dm = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
  const ano = d.getFullYear() !== new Date().getFullYear() ? '/' + String(d.getFullYear()).slice(2) : '';
  return `${DIAS[d.getDay()]} ${dm}${ano}`;
}
function fmtDiaMes(s) { const d = deISO(s); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; }
function fmtDataLonga(s) {
  const t = deISO(s).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function fmtDataHora(isoCompleto) {
  const d = new Date(isoCompleto);
  return `${fmtDiaMes(iso(d))}/${d.getFullYear()} às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// Números no padrão brasileiro
function fmtN(n, casas) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  return n.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}
function fmtKg(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}
function fmtKgCampo(n) { return n == null ? '' : n.toLocaleString('pt-BR', { maximumFractionDigits: 2, useGrouping: false }); }
function fmtDif(n, casas) { if (n == null || !Number.isFinite(n)) return '—'; const r = arred(n, casas); return (r > 0 ? '+' : r < 0 ? '−' : '') + fmtN(Math.abs(r), casas); }
function arred(n, casas = 2) { const f = 10 ** casas; return Math.round(n * f) / f; }

// Aceita "82,5", "82.5" e "1.234,5"
function lerNumero(txt) {
  let s = String(txt ?? '').trim().replace(/\s/g, '');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* =====================================================================
   4. Regras de negócio
   ===================================================================== */
function exPorId(id) { return estado.exercicios.find(e => e.id === id); }

function sessoesOrdenadas() {
  return [...estado.sessoes].sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : a.criadaEm - b.criadaEm));
}

function exerciciosDoTreino(t) {
  return estado.exercicios
    .filter(e => e.ativo && (e.treino === t || e.treino === 'AB'))
    .sort((a, b) => a.ordem - b.ordem);
}

// Regra 1: sugere o treino do dia (quando o plano tem dia fixo) ou o seguinte ao último registrado
function proximoTreino() {
  const ts = PERFIL.treinos;
  const doDia = PERFIL.treinoDoDia && PERFIL.treinoDoDia[diaDaSemana(hojeISO())];
  if (doDia) return doDia;
  const s = sessoesOrdenadas();
  const ultima = s[s.length - 1];
  if (!ultima) return ts[0];
  const i = ts.indexOf(ultima.treino);
  return ts[(i + 1) % ts.length];
}

// Fases de carga: semana do plano contada a partir de config.inicioPlano
function semanaDoPlano(data) {
  const ini = estado.config.inicioPlano;
  if (!ini) return 1;
  return Math.max(1, Math.floor(difDias(ini, data) / 7) + 1);
}
function faseDe(ex, data) {
  if (!ex.fases || !ex.fases.length) return null;
  const sem = semanaDoPlano(data);
  let i = 0;
  ex.fases.forEach((f, k) => { if (sem >= f.semana) i = k; });
  const prox = ex.fases[i + 1];
  return { ...ex.fases[i], n: i + 1, ate: prox ? prox.semana - 1 : null };
}
function prescricao(ex, data) {
  const f = faseDe(ex, data || hojeISO());
  return f ? { series: f.series, repMin: f.repMin, repMax: f.repMax, fase: f }
           : { series: ex.series, repMin: ex.repMin, repMax: ex.repMax, fase: null };
}
function unidadeReps(ex) { return ex.un === 's' ? 's' : ex.un === 'm' ? 'm' : 'rep'; }
function passoReps(ex) { return ex.un === 's' || ex.un === 'm' ? 5 : 1; }

// Regra 2: última sessão em que o exercício foi feito (até a data, ignorando a sessão em edição)
function ultimaVez(exId, ateData, ignorarId) {
  const s = sessoesOrdenadas();
  for (let i = s.length - 1; i >= 0; i--) {
    const sessao = s[i];
    if (sessao.id === ignorarId || sessao.data > ateData) continue;
    const item = sessao.itens.find(it => it.exercicioId === exId && it.series.length);
    if (item) return { sessao, item };
  }
  return null;
}

// Regra 3: todas as séries previstas chegaram ao topo da faixa
// Exercícios sem carga não sobem carga; nas fases, só conta se a última vez foi na mesma fase
function deveSubir(ex, ult, data) {
  if (!ult || ex.semCarga) return false;
  const p = prescricao(ex, data);
  if (p.fase) {
    const f = faseDe(ex, ult.sessao.data);
    if (!f || f.n !== p.fase.n) return false;
  }
  return ult.item.series.length >= p.series && ult.item.series.every(s => s.reps >= p.repMax);
}

// A fase mudou desde a última vez: avisar para ajustar a carga à nova faixa
function mudouFase(ex, ult, data) {
  if (!ult || !ex.fases || ex.semCarga) return false;
  const a = faseDe(ex, ult.sessao.data), b = faseDe(ex, data);
  return !!a && !!b && a.n !== b.n;
}

// Regra 4: monta as séries pré-preenchidas de um exercício
function montarItem(ex, data, ignorarId, salvo) {
  const ult = ultimaVez(ex.id, data, ignorarId);
  const subir = !salvo && deveSubir(ex, ult, data);
  const p = prescricao(ex, data);
  const total = Math.max(p.series, salvo ? salvo.series.length : 0);
  const series = [];
  for (let i = 0; i < total; i++) {
    if (salvo && salvo.series[i]) {
      const s = salvo.series[i];
      series.push({ kg: s.kg, reps: s.reps, folga: s.folga ?? null, feita: true });
      continue;
    }
    const base = ult ? (ult.item.series[i] || ult.item.series[ult.item.series.length - 1]) : null;
    let kg = base && !ex.semCarga ? base.kg : 0;
    let reps = base ? base.reps : p.repMin;
    if (subir) { kg = arred(kg + ex.passoKg); reps = p.repMin; }
    if (!subir && mudouFase(ex, ult, data)) reps = p.repMin;
    series.push({ kg, reps, folga: null, feita: false });
  }
  let variacao = salvo ? salvo.variacao : (ult ? ult.item.variacao : null);
  if (!salvo && ex.variacoes.length && !ex.variacoes.includes(variacao)) variacao = ex.variacoes[0];
  if (!ex.variacoes.length && !salvo) variacao = null;
  return { exercicioId: ex.id, nome: ex.nome, variacao, subiu: subir, series };
}

function novoRascunho(treino) {
  const data = hojeISO();
  estado.rascunho = {
    editandoId: null, data, treino,
    descansoS: estado.config.descansoS, descansoFim: null,
    itens: exerciciosDoTreino(treino).map(ex => montarItem(ex, data, null, null)),
  };
}

function rascunhoDeSessao(sessao) {
  const plano = exerciciosDoTreino(sessao.treino);
  const itens = plano.map(ex => montarItem(ex, sessao.data, sessao.id, sessao.itens.find(it => it.exercicioId === ex.id)));
  // Exercícios que estão na sessão mas saíram do plano
  sessao.itens.filter(it => !plano.some(ex => ex.id === it.exercicioId)).forEach(it => {
    const ex = exPorId(it.exercicioId) || { id: it.exercicioId, nome: it.nome, series: it.series.length, repMin: 8, repMax: 12, passoKg: 2.5, variacoes: [] };
    const item = montarItem(ex, sessao.data, sessao.id, it);
    item.nome = it.nome;
    itens.push(item);
  });
  estado.rascunho = {
    editandoId: sessao.id, data: sessao.data, treino: sessao.treino,
    descansoS: estado.config.descansoS, descansoFim: null, itens,
  };
}

function contarSeries(r) {
  let feitas = 0, total = 0;
  r.itens.forEach(it => it.series.forEach(s => { total++; if (s.feita) feitas++; }));
  return { feitas, total };
}

function idSessao(data, treino) {
  const base = `${data}-${treino.toLowerCase()}`;
  let id = base, n = 2;
  while (estado.sessoes.some(s => s.id === id)) id = `${base}-${n++}`;
  return id;
}

// Regra 6: salva só as séries concluídas
function gravarRascunho() {
  const r = estado.rascunho;
  const itens = r.itens
    .map(it => ({
      exercicioId: it.exercicioId, nome: it.nome, variacao: it.variacao,
      series: it.series.filter(s => s.feita).map(s => ({ kg: s.kg, reps: s.reps, folga: s.folga })),
    }))
    .filter(it => it.series.length);
  const existente = r.editandoId && estado.sessoes.find(s => s.id === r.editandoId);
  if (existente) {
    existente.data = r.data;
    existente.itens = itens;
  } else {
    estado.sessoes.push({ id: idSessao(r.data, r.treino), data: r.data, treino: r.treino, criadaEm: Date.now(), itens });
  }
  const editando = !!r.editandoId;
  estado.rascunho = null;
  salvar();
  return editando;
}

function volumeSessao(s) { return s.itens.reduce((t, it) => t + it.series.reduce((u, se) => u + se.kg * se.reps, 0), 0); }
function seriesSessao(s) { return s.itens.reduce((t, it) => t + it.series.length, 0); }

function noPeriodo(data) { const p = PERFIL.periodo; return !!p && data >= p.inicio && data <= p.fim; }
function treinosNoPeriodo() { return estado.sessoes.filter(s => noPeriodo(s.data)).length; }
function nasUltimas4Semanas(data) { const d = difDias(data, hojeISO()); return d >= 0 && d < 28; }
function marcadoHoje(k) { return (estado.marcas[k] || []).includes(hojeISO()); }
function rotuloMarca(k) { const m = PERFIL.marcas.find(([x]) => x === k); return m ? m[1] : k; }
function totalMarcas() { return Object.values(estado.marcas).reduce((t, l) => t + l.length, 0); }

// Medidas: calculadas e média móvel de 4 semanas (janela de 28 dias)
function medidasOrdenadas() { return [...estado.medidas].sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0)); }
function massaGorda(m) { return m.pesoKg != null && m.gorduraPct != null ? m.pesoKg * m.gorduraPct / 100 : null; }
function massaMagra(m) { const g = massaGorda(m); return g == null ? null : m.pesoKg - g; }
function relCinturaAltura(m) { return m.cinturaCm != null && estado.config.alturaCm > 0 ? m.cinturaCm / estado.config.alturaCm : null; }

function serieMedida(fn) {
  return medidasOrdenadas().map(m => ({ data: m.data, y: fn(m) })).filter(p => p.y != null && Number.isFinite(p.y));
}
function mediaMovel(pontos) {
  return pontos.map(p => {
    const janela = pontos.filter(q => q.data <= p.data && difDias(q.data, p.data) < 28);
    return { data: p.data, y: janela.reduce((t, q) => t + q.y, 0) / janela.length };
  });
}

function medidaAnterior(data, ignorarId) {
  const lista = medidasOrdenadas().filter(m => m.data < data && m.id !== ignorarId);
  return lista[lista.length - 1] || null;
}

// No dia de medida do perfil, avisa se ainda não há registro na semana (segunda a domingo)
function lembreteMedidas(hoje) {
  if (diaDaSemana(hoje) !== PERFIL.diaMedida) return false;
  const ini = segundaDaSemana(hoje), fim = somarDias(ini, 6);
  return !estado.medidas.some(m => m.data >= ini && m.data <= fim);
}

function diasDesdeBackup() {
  if (!estado.ultimoBackup) return null;
  return difDias(iso(new Date(estado.ultimoBackup)), hojeISO());
}

/* =====================================================================
   5. Estado da interface (não é salvo)
   ===================================================================== */
let estado = PERFIL ? carregar() : null;
const ui = {
  verSemana: false,
  tela: 'hoje',
  treinoEscolhido: null,   // troca manual A/B na tela Hoje
  planoTreino: null,       // treino aberto na tela "Ver treino"
  form: null,              // 'corrida' | 'medidas' aberto na tela Hoje
  confirmar: null,         // chave da confirmação aberta
  flash: null,             // { txt, alerta }
  histFiltro: 'tudo',
  histAberto: null,
  histEditando: null,
  exEditando: null,        // id do exercício em edição, ou 'novo'
  exProgresso: null,
  importPendente: null,
  leituras: {},            // ponto tocado em cada gráfico
};

/* =====================================================================
   6. Telas
   ===================================================================== */
function flash() {
  if (!ui.flash) return '';
  return `<div class="flash ${ui.flash.alerta ? 'alerta' : ''}" role="status"><span>${esc(ui.flash.txt)}</span>
    <button class="link" data-acao="fechar-flash" aria-label="Fechar aviso">Fechar</button></div>`;
}

function avisosGerais() {
  let h = '';
  if (avisoArmazenamento) h += `<div class="flash alerta"><span>${esc(avisoArmazenamento)}</span><button class="link" data-acao="fechar-aviso-arm">Fechar</button></div>`;
  if (erroSalvar) h += `<div class="flash alerta"><span>Não consegui salvar no aparelho. Exporte um backup agora.</span></div>`;
  return h;
}

/* ---------- 6.1 Hoje ---------- */
function telaHoje() {
  const hoje = hojeISO();
  const r = estado.rascunho;
  let h = `<header class="topo"><h1>Registro de treino</h1><p class="data">${fmtDataLonga(hoje)}</p></header>`;
  h += avisosGerais() + flash();

  if (lembreteMedidas(hoje) && ui.form !== 'medidas') {
    h += `<section class="cartao alerta">
      <h2>${esc(PERFIL.lembrete[0])}</h2>
      <p>${esc(PERFIL.lembrete[1])}</p>
      <button class="botao terra cheio" data-acao="abrir-form" data-f="medidas">Registrar</button>
    </section>`;
  }

  if (PERFIL.semana) h += cartaoDia(hoje);

  if (r) {
    const { feitas, total } = contarSeries(r);
    h += `<section class="cartao ok">
      <h2>${r.editandoId ? 'Editando treino' : 'Treino'} ${r.treino} em andamento</h2>
      <p class="sec-txt">${fmtData(r.data)} · <span class="num">${feitas} de ${total}</span> séries</p>
      <button class="botao grande" data-acao="ir" data-tela="treino">Continuar treino</button>
    </section>`;
  } else {
    const sugerido = proximoTreino();
    const t = ui.treinoEscolhido || sugerido;
    const ultima = sessoesOrdenadas().pop();
    const nomes = exerciciosDoTreino(t).map(e => e.nome).join(', ');
    h += `<section class="cartao">
      <h2>Próximo treino</h2>
      ${alternadorTreinos(t, sugerido, 'escolher-treino')}
      ${PERFIL.nomesTreino[t] ? `<p><strong>${esc(PERFIL.nomesTreino[t])}</strong></p>` : ''}
      <p class="sec-txt peq">${ultima ? `Último: treino ${ultima.treino} em ${fmtData(ultima.data)}.` : 'Nenhum treino registrado ainda.'}</p>
      <p class="peq">${esc(nomes)}</p>
      <button class="botao grande" data-acao="iniciar-treino" data-t="${t}">Iniciar treino ${t}</button>
      <button class="botao sec cheio" data-acao="ver-plano" data-t="${t}">Ver exercícios do treino ${t}</button>
    </section>`;
  }

  if (PERFIL.periodo) h += cartaoPeriodo(hoje);

  // Atalhos: corrida e medidas abrem formulário; as aulas marcam o dia com um toque
  const feitasHoje = PERFIL.marcas.filter(([k]) => marcadoHoje(k));
  h += `<h2 class="secao-titulo">Registrar</h2>
    <div class="acoes" style="margin-bottom:12px">
      <button class="botao sec" data-acao="abrir-form" data-f="corrida">Corrida</button>
      ${PERFIL.marcas.map(([k, rot]) => `<button class="botao ${marcadoHoje(k) ? '' : 'sec'}" data-acao="marcar" data-k="${k}" aria-pressed="${marcadoHoje(k)}">${esc(rot)}</button>`).join('')}
      <button class="botao sec" data-acao="abrir-form" data-f="medidas">${PERFIL.periodo ? 'Medidas' : 'Semana'}</button>
    </div>`;
  if (feitasHoje.length) {
    h += `<p class="peq" style="margin-bottom:12px">Registrado hoje: ${esc(feitasHoje.map(([, r]) => r).join(', '))}. Toque de novo para desfazer.</p>`;
  }
  if (ui.form === 'corrida') h += formCorrida(null);
  if (ui.form === 'medidas') h += formMedidas(null);

  // Backup
  const dias = diasDesdeBackup();
  const temDados = estado.sessoes.length || estado.corridas.length || totalMarcas() || estado.medidas.length > 1;
  const atrasado = dias === null ? temDados : dias > DIAS_ALERTA_BACKUP;
  h += `<section class="cartao ${atrasado ? 'alerta' : ''}">
    <p>${dias === null ? 'Nenhum backup feito ainda.' : `Último backup: ${fmtDataHora(estado.ultimoBackup)} (${dias === 0 ? 'hoje' : dias === 1 ? 'há 1 dia' : `há ${dias} dias`}).`}
    ${atrasado ? '<br><strong class="alerta-txt">Faça um backup: os dados só existem neste aparelho.</strong>' : ''}</p>
    <button class="botao ${atrasado ? 'terra' : 'sec'} cheio" data-acao="exportar-json">Exportar backup</button>
  </section>`;
  return h;
}

// Seletor de treino com tantos botões quantos treinos o plano tem
function alternadorTreinos(t, sugerido, acao) {
  const ts = PERFIL.treinos;
  return `<div class="alternador" role="group" aria-label="Escolher treino" style="grid-template-columns:repeat(${ts.length}, 1fr)">
    ${ts.map(x => `<button class="${x === t ? 'sel' : ''}" data-acao="${acao}" data-t="${x}" aria-pressed="${x === t}">
      ${x}${x === sugerido ? '<small>sugerido</small>' : ''}</button>`).join('')}
  </div>`;
}

// Plano do dia (perfis com semana fixa) e a semana inteira sob demanda
function cartaoDia(hoje) {
  const dow = diaDaSemana(hoje);
  const dia = PERFIL.semana[dow];
  let h = `<section class="cartao">
    <h2>Hoje</h2>
    <ul class="dia-lista">${dia.itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    <p class="dica">${esc(dia.dica)}</p>`;
  const saltos = exPorId('saltos');
  if (saltos && !saltos.ativo && /Musculação/.test(dia.itens.join(' '))) {
    h += `<p class="sec-txt peq">Saltos: reative em Config, nos arquivados, depois da liberação médica.</p>`;
  }
  if (ui.verSemana) {
    const ordem = [1, 2, 3, 4, 5, 6, 0];
    h += `<table class="semana-tab">${ordem.map(d => `<tr class="${d === dow ? 'hoje' : ''}"><td>${DIAS[d]}</td><td>${esc(PERFIL.semana[d].itens.join(' · '))}</td></tr>`).join('')}</table>`;
  }
  h += `<button class="link" data-acao="ver-semana">${ui.verSemana ? 'Esconder a semana' : 'Ver a semana'}</button>
  </section>`;
  return h;
}

function cartaoPeriodo(hoje) {
  const PERIODO = PERFIL.periodo;
  const n = treinosNoPeriodo();
  const pct = Math.min(100, n / PERIODO.meta * 100);
  let quando;
  if (hoje < PERIODO.inicio) quando = `Começa em ${fmtData(PERIODO.inicio)}`;
  else if (hoje > PERIODO.fim) quando = 'Período encerrado';
  else {
    const semana = Math.floor(difDias(PERIODO.inicio, hoje) / 7) + 1;
    const total = Math.ceil((difDias(PERIODO.inicio, PERIODO.fim) + 1) / 7);
    quando = `Semana ${semana} de ${total}`;
  }
  return `<section class="cartao">
    <p>${quando} · <span class="num">${n}</span> de <span class="num">${PERIODO.meta}</span> treinos</p>
    <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="${PERIODO.meta}" aria-valuenow="${n}"><span style="width:${pct}%"></span></div>
  </section>`;
}

/* ---------- 6.3 Treino em andamento ---------- */
function telaTreino() {
  const r = estado.rascunho;
  const { feitas, total } = contarSeries(r);
  let h = `<header class="barra-treino">
    <div class="linha1">
      <button class="link" data-acao="ir" data-tela="hoje">‹ Hoje</button>
      <strong>${r.editandoId ? 'Editando treino' : 'Treino'} ${r.treino}</strong>
      <span class="num" aria-label="${feitas} de ${total} séries">${feitas}/${total}</span>
    </div>
    <div class="descanso">${blocoDescanso(r)}</div>
  </header>`;
  h += avisosGerais() + flash();
  h += `<label class="campo" style="margin-bottom:12px"><span>Data do treino</span>
    <input type="date" data-campo="treino-data" value="${r.data}"></label>`;
  h += r.itens.map((it, i) => cartaoExercicio(it, i, r)).join('');

  h += `<div class="fim-treino">`;
  if (ui.confirmar === 'salvar-incompleto') {
    h += `<div class="confirmacao"><p><strong class="num">${feitas} de ${total}</strong> séries concluídas. Salvar assim?</p>
      <div class="acoes"><button class="botao terra" data-acao="salvar-confirmado">Salvar assim</button>
      <button class="botao sec" data-acao="cancelar-confirmacao">Voltar ao treino</button></div></div>`;
  }
  if (ui.confirmar === 'descartar') {
    h += `<div class="confirmacao"><p>${r.editandoId ? 'Descartar as alterações? A sessão salva continua como estava.' : 'Descartar este treino? As séries marcadas serão perdidas.'}</p>
      <div class="acoes"><button class="botao terra" data-acao="descartar-confirmado">Descartar</button>
      <button class="botao sec" data-acao="cancelar-confirmacao">Voltar ao treino</button></div></div>`;
  }
  h += `<p class="sec-txt"><span class="num">${feitas} de ${total}</span> séries concluídas</p>
    <button class="botao grande" data-acao="salvar-treino">${r.editandoId ? 'Salvar alterações' : 'Salvar treino'}</button>
    <button class="botao sec cheio" data-acao="descartar-treino">${r.editandoId ? 'Cancelar edição' : 'Descartar treino'}</button>
  </div>`;
  return h;
}

function blocoDescanso(r) {
  const chips = TEMPOS_DESCANSO.map(s => `<button class="chip ${r.descansoS === s ? 'sel' : ''}" data-acao="descanso-tempo" data-v="${s}" aria-pressed="${r.descansoS === s}">${s} s</button>`).join('');
  const direita = r.descansoFim
    ? `<span id="cronometro" class="cron num" role="timer"></span><button class="botao sec" data-acao="descanso-parar">Parar</button>`
    : `<button class="botao sec" data-acao="descanso-iniciar" style="margin-left:auto" aria-label="Iniciar descanso">Iniciar</button>`;
  return `<span class="sec-txt peq">Descanso</span>${chips}${direita}`;
}

function cartaoExercicio(it, i, r) {
  const ex = exPorId(it.exercicioId) || { repMin: 8, repMax: 12, series: it.series.length, variacoes: [], passoKg: 2.5 };
  const ult = ultimaVez(it.exercicioId, r.data, r.editandoId);
  const subir = deveSubir(ex, ult, r.data);
  const p = prescricao(ex, r.data);
  const un = unidadeReps(ex);
  const nomeUn = un === 's' ? 'segundos' : un === 'm' ? 'metros' : 'repetições';

  const ref = ult
    ? `Última vez · ${fmtData(ult.sessao.data)}${ult.item.variacao ? ' · ' + esc(ult.item.variacao) : ''}:
       <span class="num">${ult.item.series.map(s => textoSerie(ex, s)).join(' · ')}</span>`
    : ex.semCarga ? 'Primeira vez.' : 'Primeira vez: defina a carga.';

  let aviso = '';
  if (subir) {
    aviso = `<p class="subir"><span class="selo">Subir carga</span>${it.subiu
      ? `carga aumentada: <span class="num">+${fmtKg(ex.passoKg)} kg</span> · meta ${p.repMin} ${un}`
      : `meta ${p.repMin} ${un}`}</p>`;
  } else if (mudouFase(ex, ult, r.data)) {
    aviso = `<p class="subir"><span class="selo">Nova fase</span>agora ${p.series} × ${p.repMin}–${p.repMax}: suba a carga até caber na faixa</p>`;
  }
  const fase = p.fase
    ? `<p class="fase">Fase <b>${p.fase.n}</b> · semana ${semanaDoPlano(r.data)} do plano${p.fase.ate ? ` · até a semana ${p.fase.ate}` : ''}</p>`
    : '';

  const variacoes = ex.variacoes.length
    ? `<div class="chips" role="group" aria-label="Variação">${ex.variacoes.map(v => `<button class="chip ${it.variacao === v ? 'sel' : ''}" data-acao="variacao" data-i="${i}" data-v="${esc(v)}" aria-pressed="${it.variacao === v}">${esc(v)}</button>`).join('')}</div>`
    : '';

  const series = it.series.map((s, j) => {
    const d = `data-i="${i}" data-s="${j}"`;
    const kg = ex.semCarga ? '' : `<div class="stepper st-kg">
        <button data-acao="kg" ${d} data-d="-1" aria-label="Menos carga, série ${j + 1}">−</button>
        <input data-campo="kg" ${d} value="${fmtKgCampo(s.kg)}" inputmode="decimal" aria-label="Carga em kg, série ${j + 1}">
        <button data-acao="kg" ${d} data-d="1" aria-label="Mais carga, série ${j + 1}">+</button>
      </div>`;
    const folga = ex.semCarga ? '' : `<div class="folga" role="group" aria-label="Folga, série ${j + 1}"><span class="rot">folga</span>
        ${[0, 1, 2, 3].map(v => `<button class="chip ${s.folga === v ? 'sel' : ''}" data-acao="folga" ${d} data-v="${v}" aria-pressed="${s.folga === v}">${v}</button>`).join('')}
      </div>`;
    return `<div class="serie ${s.feita ? 'feita' : ''} ${ex.semCarga ? 'sem-carga' : ''}">
      <span class="n num">${j + 1}</span>
      ${kg}
      <div class="stepper st-reps">
        <button data-acao="reps" ${d} data-d="-1" aria-label="Menos ${nomeUn}, série ${j + 1}">−</button>
        <input data-campo="reps" ${d} value="${s.reps}" inputmode="numeric" aria-label="${nomeUn}, série ${j + 1}">
        <button data-acao="reps" ${d} data-d="1" aria-label="Mais ${nomeUn}, série ${j + 1}">+</button>
      </div>
      ${folga}
      <button class="botao concluir ${s.feita ? '' : 'sec'}" data-acao="feita" ${d} aria-pressed="${s.feita}">${s.feita ? 'Feita' : 'Concluir'}</button>
    </div>`;
  }).join('');

  return `<section class="cartao exercicio">
    <div class="ex-cab"><h2>${esc(it.nome)}${ex.principal ? ' <span class="selo principal">principal</span>' : ''}</h2><span class="faixa num">${faixaTexto(p, un)}</span></div>
    ${fase}
    <p class="ref">${ref}</p>
    ${aviso}${variacoes}
    <div class="series-cab"><span></span>${ex.semCarga ? `<span>${nomeUn}</span><span></span>` : `<span>carga (kg)</span><span>${nomeUn}</span>`}</div>
    <div>${series}</div>
    <button class="link" data-acao="mais-serie" data-i="${i}">Acrescentar série</button>
  </section>`;
}

const TEMPOS_DESCANSO = [60, 90, 120, 180];

function faixaTexto(p, un) {
  return p.repMin === p.repMax ? `${p.repMin} ${un}` : `${p.repMin}–${p.repMax} ${un}`;
}
// "20×8" com carga; "10" ou "30 s" sem carga
function textoSerie(ex, s) {
  const u = ex.un ? ' ' + ex.un : '';
  return ex.semCarga ? `${s.reps}${u}` : `${fmtKg(s.kg)}×${s.reps}${u}`;
}

/* ---------- 6.3b Ver treino (só consulta) ---------- */
function telaPlano() {
  const t = ui.planoTreino || ui.treinoEscolhido || proximoTreino();
  const hoje = hojeISO();
  let h = `<header class="topo"><button class="link" data-acao="ir" data-tela="hoje">‹ Hoje</button><h1>Treinos</h1></header>`;
  h += avisosGerais() + flash();
  h += `<div style="margin-bottom:12px">${alternadorTreinos(t, null, 'plano-treino')}</div>`;
  if (PERFIL.nomesTreino[t]) h += `<p style="margin-bottom:12px"><strong>Treino ${t}: ${esc(PERFIL.nomesTreino[t])}</strong></p>`;
  h += exerciciosDoTreino(t).map(ex => cartaoPlano(ex, hoje)).join('');
  h += estado.rascunho
    ? `<button class="botao grande" data-acao="ir" data-tela="treino">Continuar treino ${estado.rascunho.treino}</button>`
    : `<button class="botao grande" data-acao="iniciar-treino" data-t="${t}">Iniciar treino ${t}</button>`;
  return h;
}

function cartaoPlano(ex, hoje) {
  const g = guiaDe(ex);
  const ult = ultimaVez(ex.id, hoje, null);
  const lista = ms => ms.map(m => NOMES_MUSCULOS[m]).join(', ');
  const p = prescricao(ex, hoje);
  return `<section class="cartao">
    <div class="plano-linha">
      ${g ? figuraMusculos(g) : '<span></span>'}
      <div class="plano-info">
        <h2>${esc(ex.nome)}${ex.principal ? ' <span class="selo principal">principal</span>' : ''}</h2>
        <p class="sec-txt peq">${p.series} séries · ${faixaTexto(p, unidadeReps(ex))}${p.fase ? ` · fase ${p.fase.n}` : ''}${ex.variacoes.length ? ' · ' + esc(ex.variacoes.join(' ou ')) : ''}</p>
        <p class="peq">${ult ? `Última vez: <span class="num">${ult.item.series.map(s => textoSerie(ex, s)).join(' · ')}</span>` : 'Ainda sem registro.'}</p>
        ${deveSubir(ex, ult, hoje) ? '<p class="subir"><span class="selo">Subir carga</span></p>' : ''}
        ${g ? `<p class="peq"><span class="ponto-cor mp"></span>${lista(g.p)}${g.s.length ? `<br><span class="ponto-cor ms"></span>${lista(g.s)}` : ''}</p>` : ''}
      </div>
    </div>
    ${g && g.dica ? `<p class="dica">${esc(g.dica)}</p>` : ''}
  </section>`;
}

// Corpo de frente e de costas; músculos principais em terra, secundários em mostarda
function figuraMusculos(g) {
  const cor = m => (g.p.includes(m) ? 'mp' : g.s.includes(m) ? 'ms' : 'mn');
  const par = (m, cx, cy, rx, ry) => `<ellipse class="${cor(m)}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><ellipse class="${cor(m)}" cx="${60 - cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
  const corpo = `<g class="corpo">
    <circle cx="30" cy="10" r="7.5"/><rect x="27" y="16" width="6" height="6"/>
    <path d="M17,23 Q30,19 43,23 Q46,24 46,28 L43,64 Q30,69 17,64 L14,28 Q14,24 17,23 Z"/>
    <rect x="8" y="24" width="8" height="26" rx="4"/><rect x="44" y="24" width="8" height="26" rx="4"/>
    <rect x="7" y="49" width="7" height="25" rx="3.5"/><rect x="46" y="49" width="7" height="25" rx="3.5"/>
    <circle cx="10.5" cy="77" r="3"/><circle cx="49.5" cy="77" r="3"/>
    <rect x="18" y="63" width="11.5" height="38" rx="5.5"/><rect x="30.5" y="63" width="11.5" height="38" rx="5.5"/>
    <rect x="19" y="99" width="9.5" height="27" rx="4.5"/><rect x="31.5" y="99" width="9.5" height="27" rx="4.5"/>
    <ellipse cx="23.5" cy="127.5" rx="5" ry="2.5"/><ellipse cx="36.5" cy="127.5" rx="5" ry="2.5"/>
  </g>`;
  const frente = corpo
    + par('ombros', 15.5, 27, 4.5, 4) + par('peito', 24, 32, 6.5, 5)
    + par('biceps', 11.8, 37, 2.8, 7.5) + par('antebraco', 10.5, 61, 2.6, 8)
    + `<rect class="${cor('abdomen')}" x="25" y="40" width="10" height="21" rx="3"/>`
    + par('quadriceps', 23.8, 82, 4.5, 13);
  const costas = corpo
    + `<path class="${cor('costas')}" d="M24,22 L36,22 L30,31 Z"/>`
    + `<path class="${cor('costas')}" d="M19,28 L29,31 L29,49 L21,51 Q17.5,40 19,28 Z"/><path class="${cor('costas')}" d="M41,28 L31,31 L31,49 L39,51 Q42.5,40 41,28 Z"/>`
    + par('ombros', 15.5, 27, 4.5, 4) + par('triceps', 11.8, 37, 2.8, 7.5)
    + `<rect class="${cor('lombar')}" x="24" y="52" width="12" height="10" rx="3"/>`
    + par('gluteos', 24.5, 69, 5.5, 5) + par('posteriores', 23.8, 87, 4.3, 11) + par('panturrilha', 23.8, 109, 3.6, 8);
  const rotulo = `Músculos: ${g.p.map(m => NOMES_MUSCULOS[m]).join(', ')}`;
  return `<svg class="figura" viewBox="0 0 126 142" role="img" aria-label="${esc(rotulo)}">
    <g>${frente}</g><g transform="translate(66 0)">${costas}</g>
    <text x="30" y="140" text-anchor="middle">frente</text><text x="96" y="140" text-anchor="middle">costas</text>
  </svg>`;
}

/* ---------- 6.4 Progresso ---------- */
function telaProgresso() {
  const hoje = hojeISO();
  let h = `<header class="topo"><h1>Progresso</h1></header>` + avisosGerais() + flash();

  if (!PERFIL.periodo) return h + progressoSemanal() + progressoExercicios();

  // Academia no período
  const PERIODO = PERFIL.periodo;
  const n = treinosNoPeriodo();
  const corridas = estado.corridas.filter(c => noPeriodo(c.data)).length;
  const pilates = (estado.marcas.pilates || []).filter(noPeriodo).length;
  h += `<section class="cartao">
    <h2>Academia</h2>
    <div class="contador"><span class="grande">${n}</span><span class="sec-txt">de ${PERIODO.meta} treinos</span></div>
    <div class="barra"><span style="width:${Math.min(100, n / PERIODO.meta * 100)}%"></span></div>
    <p class="sec-txt peq">De ${fmtDiaMes(PERIODO.inicio)} a ${fmtDiaMes(PERIODO.fim)} · corridas <span class="num">${corridas}</span> · Pilates <span class="num">${pilates}</span></p>
  </section>`;

  // Medidas
  h += `<h2 class="secao-titulo">Medidas</h2>`;
  h += cartaoResumoMedidas();
  const peso = serieMedida(m => m.pesoKg);
  const gord = serieMedida(m => m.gorduraPct);
  const mg = serieMedida(massaGorda);
  const mm = serieMedida(massaMagra);
  const visc = serieMedida(m => m.visceral);
  const cint = serieMedida(m => m.cinturaCm);
  const rca = serieMedida(relCinturaAltura);

  h += cartaoGrafico('peso', 'Peso', peso, { un: 'kg', casas: 2, media: true });
  h += cartaoGrafico('gord', 'Gordura', gord, { un: '%', casas: 1, media: true });
  h += `<section class="cartao"><h3>Massa gorda e massa magra</h3>
    ${blocoGrafico('mg', 'Massa gorda', mg, { un: 'kg', casas: 2, media: true })}
    ${blocoGrafico('mm', 'Massa magra', mm, { un: 'kg', casas: 2, media: true })}
    ${legendaMedidas(false)}
  </section>`;
  h += cartaoGrafico('visc', 'Gordura visceral', visc, { un: '', casas: 0, media: true, meta: { y: META_VISCERAL, rotulo: `meta ${META_VISCERAL}` } });
  h += cartaoGrafico('cint', 'Cintura', cint, { un: 'cm', casas: 1, media: true, meta: { y: META_CINTURA, rotulo: `meta ${META_CINTURA} cm` } });
  h += cartaoGrafico('rca', 'Relação cintura/altura', rca, { un: '', casas: 2, media: true, meta: { y: META_RCA, rotulo: `meta ${fmtN(META_RCA, 2)}` },
    nota: `Altura considerada: ${fmtN(estado.config.alturaCm, 0)} cm (muda em Config).` });
  h += `<p class="nota">Valores de bioimpedância variam com a hidratação. Considere a tendência de 3 a 4 semanas.</p>`;
  return h + progressoExercicios();
}

// Perfis sem período fixo: frequência das últimas 4 semanas, energia, peso e barriga
function progressoSemanal() {
  const treinos = estado.sessoes.filter(s => nasUltimas4Semanas(s.data)).length;
  const corridas = estado.corridas.filter(c => nasUltimas4Semanas(c.data)).length;
  const aulas = PERFIL.marcas.map(([k, rot]) => `${esc(rot)} <span class="num">${(estado.marcas[k] || []).filter(nasUltimas4Semanas).length}</span>`).join(' · ');
  let h = `<section class="cartao">
    <h2>Últimas 4 semanas</h2>
    <div class="contador"><span class="grande">${treinos}</span><span class="sec-txt">treinos de musculação (o plano prevê 12)</span></div>
    <div class="barra"><span style="width:${Math.min(100, treinos / 12 * 100)}%"></span></div>
    <p class="sec-txt peq">Corridas <span class="num">${corridas}</span> · ${aulas}</p>
    ${estado.config.inicioPlano ? `<p class="sec-txt peq">Semana ${semanaDoPlano(hojeISO())} do plano, iniciado em ${fmtData(estado.config.inicioPlano)}.</p>` : ''}
  </section>`;
  h += `<h2 class="secao-titulo">Semana a semana</h2>`;
  h += cartaoResumoMedidas();
  h += cartaoGrafico('energia', 'Energia', serieMedida(m => m.energia), { un: 'de 10', casas: 0, media: true });
  h += cartaoGrafico('peso', 'Peso', serieMedida(m => m.pesoKg), { un: 'kg', casas: 1, media: false });
  h += cartaoGrafico('cint', 'Barriga (umbigo)', serieMedida(m => m.cinturaCm), { un: 'cm', casas: 1, media: false });
  h += `<p class="nota">Peso e barriga variam de um dia para o outro. Olhe a tendência de alguns meses, não uma medida isolada.</p>`;
  return h;
}

function progressoExercicios() {
  let h = `<h2 class="secao-titulo">Exercícios</h2>`;
  const comHistorico = new Set(estado.sessoes.flatMap(s => s.itens.map(it => it.exercicioId)));
  const opcoes = estado.exercicios.filter(e => e.ativo || comHistorico.has(e.id));
  if (!ui.exProgresso || !opcoes.some(e => e.id === ui.exProgresso)) ui.exProgresso = opcoes[0] ? opcoes[0].id : null;
  if (ui.exProgresso) {
    const ex = exPorId(ui.exProgresso);
    const semCarga = ex && ex.semCarga;
    const un = ex ? unidadeReps(ex) : 'rep';
    const pontosCarga = [], pontosVolume = [];
    sessoesOrdenadas().forEach(s => {
      const it = s.itens.find(x => x.exercicioId === ui.exProgresso);
      if (!it || !it.series.length) return;
      pontosCarga.push({ data: s.data, y: Math.max(...it.series.map(se => semCarga ? se.reps : se.kg)) });
      pontosVolume.push({ data: s.data, y: it.series.reduce((t, se) => t + (semCarga ? se.reps : se.kg * se.reps), 0) });
    });
    h += `<label class="campo" style="margin-bottom:12px"><span>Exercício</span>
      <select data-campo="ex-progresso">${opcoes.map(e => `<option value="${esc(e.id)}" ${e.id === ui.exProgresso ? 'selected' : ''}>${esc(e.nome)}${e.ativo ? '' : ' (arquivado)'}</option>`).join('')}</select></label>`;
    if (semCarga) {
      h += cartaoGrafico('carga', 'Melhor série', pontosCarga, { un, casas: 0, media: false });
      h += cartaoGrafico('volume', 'Total da sessão', pontosVolume, { un, casas: 0, media: false });
    } else {
      h += cartaoGrafico('carga', 'Maior carga', pontosCarga, { un: 'kg', casas: 1, media: false });
      h += cartaoGrafico('volume', 'Volume (carga × repetições)', pontosVolume, { un: 'kg', casas: 0, media: false });
    }
  }
  return h;
}

function cartaoResumoMedidas() {
  const ms = medidasOrdenadas();
  if (!ms.length) return `<section class="cartao"><p class="vazio">Nenhuma medida registrada.</p></section>`;
  const ini = ms[0], ult = ms[ms.length - 1];
  const lista = PERFIL.periodo ? [
    ['Peso', m => m.pesoKg, 'kg', 2],
    ['Massa gorda', massaGorda, 'kg', 2],
    ['Massa magra', massaMagra, 'kg', 2],
    ['Cintura', m => m.cinturaCm, 'cm', 1],
  ] : [
    ['Energia', m => m.energia, '', 0],
    ['Peso', m => m.pesoKg, 'kg', 1],
    ['Barriga', m => m.cinturaCm, 'cm', 1],
  ];
  // Plano A/B: compara a primeira e a última medida. Plano 1-2-3: peso e barriga são mensais
  // e a energia é semanal, então cada item usa o primeiro e o último registro que têm aquele valor.
  const itens = lista.map(([rot, fn, un, casas]) => {
    let a, b;
    if (PERFIL.periodo) { a = fn(ini); b = fn(ult); }
    else {
      const comValor = ms.filter(m => fn(m) != null);
      a = comValor.length ? fn(comValor[0]) : null;
      b = comValor.length ? fn(comValor[comValor.length - 1]) : null;
    }
    return `<div><div class="rot">${rot}</div>
      <div class="val">${fmtN(b, casas)} <span class="peq">${un}</span></div>
      <div class="dif">${a != null && b != null ? fmtDif(b - a, casas) + ' ' + un : '—'}</div></div>`;
  }).join('');
  return `<section class="cartao"><h3>${PERFIL.periodo ? 'Desde a medida inicial' : 'Desde o primeiro registro'}</h3>
    <p class="sec-txt peq">${fmtData(ini.data)} → ${fmtData(ult.data)}</p>
    <div class="resumo-medidas">${itens}</div></section>`;
}

function legendaMedidas(meta) {
  return `<div class="legenda"><span><i class="pt"></i>semana</span><span><i></i>média de 4 semanas</span>${meta ? '<span><i class="mt"></i>meta</span>' : ''}</div>`;
}

function cartaoGrafico(chave, titulo, pontos, op) {
  return `<section class="cartao">${blocoGrafico(chave, titulo, pontos, op, true)}
    ${op.media ? legendaMedidas(!!op.meta) : ''}
    ${op.nota ? `<p class="sec-txt peq">${esc(op.nota)}</p>` : ''}</section>`;
}

function blocoGrafico(chave, titulo, pontos, op, principal) {
  const media = op.media ? mediaMovel(pontos) : null;
  const ult = pontos[pontos.length - 1];
  const destaque = ult ? (media ? media[media.length - 1].y : ult.y) : null;
  const tag = principal ? 'h3' : 'h4';
  const cab = `<div class="graf-cab"><${tag}>${esc(titulo)}</${tag}>
    ${ult ? `<span class="sec-txt peq">${media ? 'média ' : ''}<span class="val">${fmtN(destaque, op.casas)}</span> ${op.un}</span>` : ''}</div>`;
  if (!pontos.length) return cab + `<p class="vazio">Sem dados ainda.</p>`;
  // Leitura do ponto tocado (ou o último)
  const idx = Math.min(ui.leituras[chave] ?? pontos.length - 1, pontos.length - 1);
  const p = pontos[idx];
  const leitura = `<p class="leitura">${fmtData(p.data)}: <b>${fmtN(p.y, op.casas)}</b> ${op.un}${media ? ` · média <b>${fmtN(media[idx].y, op.casas)}</b> ${op.un}` : ''}</p>`;
  return cab + grafico(chave, pontos, media, op, idx) + leitura;
}

// Gráfico de linha em SVG, um eixo só. pontos/media: [{data, y}]
function grafico(chave, pontos, media, op, ativo) {
  const W = 340, H = 150, m = { e: 42, d: 10, t: 12, b: 22 };
  const diaNum = s => deISO(s).getTime() / 864e5;
  const xs = pontos.map(p => diaNum(p.data));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 7; x1 += 7; }
  const ys = pontos.map(p => p.y).concat(media ? media.map(p => p.y) : []).concat(op.meta ? [op.meta.y] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { const folga = Math.abs(y0) * 0.02 || 1; y0 -= folga; y1 += folga; }
  const { valores, casas } = marcasEixo(y0, y1);
  y0 = valores[0]; y1 = valores[valores.length - 1];
  const X = v => (m.e + (v - x0) / (x1 - x0) * (W - m.e - m.d)).toFixed(1);
  const Y = v => (H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b)).toFixed(1);

  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.rotuloAria || '')}">`;
  valores.forEach(v => {
    s += `<line class="grade" x1="${m.e}" x2="${W - m.d}" y1="${Y(v)}" y2="${Y(v)}"/>`;
    s += `<text class="eixo" x="${m.e - 6}" y="${(+Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmtN(v, casas)}</text>`;
  });
  s += `<text class="eixo" x="${m.e}" y="${H - 6}">${fmtDiaMes(pontos[0].data)}</text>`;
  if (pontos.length > 1) s += `<text class="eixo" x="${W - m.d}" y="${H - 6}" text-anchor="end">${fmtDiaMes(pontos[pontos.length - 1].data)}</text>`;
  if (op.meta) {
    s += `<line class="meta" x1="${m.e}" x2="${W - m.d}" y1="${Y(op.meta.y)}" y2="${Y(op.meta.y)}"/>`;
    s += `<text class="meta-rot" x="${W - m.d}" y="${(+Y(op.meta.y) - 5).toFixed(1)}" text-anchor="end">${esc(op.meta.rotulo)}</text>`;
  }
  const linha = lista => 'M' + lista.map(p => `${X(diaNum(p.data))},${Y(p.y)}`).join('L');
  if (media && media.length > 1) s += `<path class="linha" d="${linha(media)}"/>`;
  if (!media && pontos.length > 1) s += `<path class="linha" d="${linha(pontos)}"/>`;
  pontos.forEach((p, i) => {
    const cls = i === ativo ? 'ponto ativo' : media ? 'ponto suave' : 'ponto';
    s += `<circle class="${cls}" cx="${X(diaNum(p.data))}" cy="${Y(p.y)}" r="4"/>`;
  });
  // Alvos de toque maiores que o ponto
  pontos.forEach((p, i) => {
    s += `<circle class="alvo" cx="${X(diaNum(p.data))}" cy="${Y(p.y)}" r="14" data-acao="ponto" data-g="${chave}" data-p="${i}"/>`;
  });
  return s + '</svg>';
}

// Marcas "redondas" do eixo Y
function marcasEixo(min, max) {
  const bruto = (max - min) / 3;
  const expoente = Math.floor(Math.log10(bruto));
  const mag = 10 ** expoente;
  const fator = [1, 2, 2.5, 5, 10].find(x => x * mag >= bruto - 1e-12);
  const passo = fator * mag;
  const inicio = Math.floor(min / passo + 1e-9) * passo;
  const valores = [];
  for (let k = 0; valores.length < 7; k++) {
    const v = arred(inicio + k * passo, 6);
    valores.push(v);
    if (v >= max - 1e-9) break;
  }
  if (valores.length < 2) valores.push(arred(inicio + passo, 6));
  // casas decimais do passo (2,5 × 0,1 = 0,25 → 2 casas)
  const casas = Math.max(0, (fator === 10 ? -(expoente + 1) : -expoente) + (fator === 2.5 ? 1 : 0));
  return { valores, casas };
}

/* ---------- 6.5 Histórico ---------- */
function registrosHistorico() {
  const lista = [];
  estado.sessoes.forEach(s => lista.push({
    k: 's:' + s.id, tipo: 'academia', data: s.data, ordem: s.criadaEm,
    titulo: `Treino ${s.treino}`,
    sub: `${seriesSessao(s)} séries · ${fmtN(volumeSessao(s), 0)} kg`,
  }));
  estado.corridas.forEach(c => lista.push({
    k: 'c:' + c.id, tipo: 'corrida', data: c.data, ordem: 0,
    titulo: 'Corrida', sub: `${fmtKg(c.min)} min · ${c.formato === 'continua' ? 'contínua' : 'corrida e caminhada'}`,
  }));
  // Aulas marcadas: a chave leva o tipo e a data ("p:yoga|2026-11-24")
  PERFIL.marcas.forEach(([tipo, rot]) => (estado.marcas[tipo] || []).forEach(d => lista.push({
    k: `p:${tipo}|${d}`, tipo, data: d, ordem: 0, titulo: rot, sub: 'feito',
  })));
  estado.medidas.forEach(m => lista.push({
    k: 'm:' + m.id, tipo: 'medidas', data: m.data, ordem: 0, titulo: PERFIL.periodo ? 'Medidas' : 'Semana',
    sub: [m.energia != null ? 'energia ' + fmtN(m.energia, 0) : null,
      m.pesoKg != null ? fmtN(m.pesoKg, PERFIL.periodo ? 2 : 1) + ' kg' : null,
      m.cinturaCm != null ? fmtN(m.cinturaCm, 1) + ' cm' : null].filter(Boolean).join(' · '),
  }));
  return lista.sort((a, b) => (a.data > b.data ? -1 : a.data < b.data ? 1 : b.ordem - a.ordem));
}

function telaHistorico() {
  let h = `<header class="topo"><h1>Histórico</h1></header>` + avisosGerais() + flash();
  const filtros = [['tudo', 'Tudo'], ['academia', 'Academia'], ['corrida', 'Corrida'], ...PERFIL.marcas, ['medidas', PERFIL.periodo ? 'Medidas' : 'Semana']];
  h += `<div class="filtros" role="group" aria-label="Filtrar">${filtros.map(([v, t]) => `<button class="chip ${ui.histFiltro === v ? 'sel' : ''}" data-acao="hist-filtro" data-v="${v}" aria-pressed="${ui.histFiltro === v}">${t}</button>`).join('')}</div>`;
  const lista = registrosHistorico().filter(r => ui.histFiltro === 'tudo' || r.tipo === ui.histFiltro);
  if (!lista.length) return h + `<p class="vazio">Nada registrado ainda.</p>`;
  h += lista.map(r => {
    const aberto = ui.histAberto === r.k;
    return `<article class="cartao reg">
      <button class="reg-cab" data-acao="hist-abrir" data-k="${esc(r.k)}" aria-expanded="${aberto}">
        <span class="d">${fmtData(r.data)}</span><span class="t">${esc(r.titulo)}</span><span class="s">${esc(r.sub)}</span>
      </button>
      ${aberto ? `<div class="reg-corpo">${corpoRegistro(r.k)}</div>` : ''}
    </article>`;
  }).join('');
  return h;
}

function corpoRegistro(k) {
  const [tipo, id] = [k.slice(0, 1), k.slice(2)];
  if (ui.histEditando === k) {
    if (tipo === 'c') return formCorrida(estado.corridas.find(c => c.id === id));
    if (tipo === 'm') return formMedidas(estado.medidas.find(m => m.id === id));
  }
  let h = '';
  if (tipo === 's') {
    const s = estado.sessoes.find(x => x.id === id);
    h += `<ul>${s.itens.map(it => {
      const ex = exPorId(it.exercicioId) || {};
      return `<li>${esc(it.nome)}${it.variacao ? ` · ${esc(it.variacao)}` : ''}
      <span class="num">${it.series.map(se => `${textoSerie(ex, se)}${se.folga != null ? ` (f${se.folga})` : ''}`).join(' · ')}</span></li>`;
    }).join('')}</ul>`;
  } else if (tipo === 'c') {
    const c = estado.corridas.find(x => x.id === id);
    if (c.obs) h += `<p>${esc(c.obs)}</p>`;
  } else if (tipo === 'm') {
    const m = estado.medidas.find(x => x.id === id);
    const linhas = PERFIL.campos.map(c => [c.rotulo, m[c.k], c.un, c.casas])
      .concat(PERFIL.periodo ? [['Massa gorda', massaGorda(m), 'kg', 2], ['Massa magra', massaMagra(m), 'kg', 2], ['Cintura/altura', relCinturaAltura(m), '', 2]] : []);
    h += `<ul>${linhas.map(([r, v, un, casas]) => `<li>${r}: <b class="num">${fmtN(v, casas)}</b> ${v != null ? un : ''}</li>`).join('')}</ul>`;
    if (m.obs) h += `<p>${esc(m.obs)}</p>`;
  }
  if (ui.confirmar === 'hist:' + k) {
    h += `<div class="confirmacao"><p>Excluir este registro? Não dá para desfazer.</p>
      <div class="acoes"><button class="botao terra" data-acao="hist-excluir-confirmado" data-k="${esc(k)}">Excluir</button>
      <button class="botao sec" data-acao="cancelar-confirmacao">Cancelar</button></div></div>`;
  } else {
    h += `<div class="acoes">${tipo !== 'p' ? `<button class="botao sec" data-acao="hist-editar" data-k="${esc(k)}">Editar</button>` : ''}
      <button class="botao terra sec" data-acao="hist-excluir" data-k="${esc(k)}">Excluir</button></div>`;
  }
  return h;
}

}

/* =====================================================================
   7. Cronômetro de descanso e tela acesa
   ===================================================================== */
let vibrou = false;

function iniciarDescanso() {
  const r = estado.rascunho;
  r.descansoFim = Date.now() + r.descansoS * 1000;
  vibrou = false;
}

function atualizarCronometro() {
  const el = document.getElementById('cronometro');
  const r = estado && estado.rascunho;
  if (!el || !r || !r.descansoFim) return;
  const resta = Math.ceil((r.descansoFim - Date.now()) / 1000);
  if (resta > 0) {
    el.textContent = `${Math.floor(resta / 60)}:${String(resta % 60).padStart(2, '0')}`;
    el.classList.remove('fim');
  } else {
    el.textContent = 'Descanso terminado';
    el.classList.add('fim');
    if (!vibrou) {
      vibrou = true;
      // Só vibra se acabou agora, não ao reabrir o app muito depois
      if (Date.now() - r.descansoFim < 5000 && navigator.vibrate) navigator.vibrate([400, 150, 400]);
    }
  }
}
setInterval(atualizarCronometro, 250);

let travaTela = null, pedindoTrava = false;
async function gerenciarTela() {
  const quer = !!estado && ui.tela === 'treino' && !!estado.rascunho && estado.config.telaAcesa !== false && document.visibilityState === 'visible';
  try {
    if (quer && !travaTela && !pedindoTrava && 'wakeLock' in navigator) {
      pedindoTrava = true;
      travaTela = await navigator.wakeLock.request('screen');
      travaTela.addEventListener('release', () => { travaTela = null; });
    } else if (!quer && travaTela) {
      await travaTela.release();
      travaTela = null;
    }
  } catch (e) {
    travaTela = null;
  } finally {
    pedindoTrava = false;
  }
}
document.addEventListener('visibilitychange', () => { gerenciarTela(); atualizarCronometro(); });

/* =====================================================================
   8. Exportar e importar
   ===================================================================== */
function carimbo() {
  const d = new Date();
  return `${hojeISO()}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
}

function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Abre o compartilhamento do Android quando o tipo é aceito (CSV); senão baixa (JSON).
async function compartilharOuBaixar(nome, conteudo, tipo) {
  try {
    const arq = new File([conteudo], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      await navigator.share({ files: [arq], title: nome });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  baixar(nome, conteudo, tipo);
  return true;
}

function jsonBackup() {
  const { rascunho, ...dados } = estado;
  return JSON.stringify(dados, null, 2);
}

async function exportarJSON() {
  const ok = await compartilharOuBaixar(`${PERFIL.arquivo}-${carimbo()}.json`, jsonBackup(), 'application/json');
  if (ok) {
    estado.ultimoBackup = new Date().toISOString();
    salvar();
    ui.flash = { txt: 'Backup exportado. Guarde o arquivo fora do celular (Drive, e-mail).' };
    render();
  }
}

// CSV para Excel em português: separador ";", vírgula decimal, UTF-8 com BOM
function campoCsv(v) {
  const s = String(v ?? '');
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function numCsv(n, casas) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '';
  return (casas === undefined ? String(arred(n, 2)) : n.toFixed(casas)).replace('.', ',');
}
function dataCsv(s) { const [a, m, d] = s.split('-'); return `${d}/${m}/${a}`; }
function montarCsv(linhas) { return '﻿' + linhas.map(l => l.map(campoCsv).join(';')).join('\r\n') + '\r\n'; }

function csvSeries() {
  const linhas = [['data', 'treino', 'exercicio', 'variacao', 'serie', 'kg', 'reps', 'folga', 'volume_kg']];
  sessoesOrdenadas().forEach(s => s.itens.forEach(it => it.series.forEach((se, j) => {
    linhas.push([dataCsv(s.data), s.treino, it.nome, it.variacao || '', j + 1, numCsv(se.kg), se.reps, se.folga ?? '', numCsv(se.kg * se.reps)]);
  })));
  return montarCsv(linhas);
}

function csvMedidas() {
  const ms = medidasOrdenadas();
  if (!PERFIL.periodo) {
    const linhas = [['data', ...PERFIL.campos.map(c => c.k), 'obs']];
    ms.forEach(m => linhas.push([dataCsv(m.data), ...PERFIL.campos.map(c => numCsv(m[c.k], c.casas)), m.obs]));
    return montarCsv(linhas);
  }
  const mmPeso = mediaMovel(serieMedida(m => m.pesoKg));
  const mmGord = mediaMovel(serieMedida(m => m.gorduraPct));
  const mmCint = mediaMovel(serieMedida(m => m.cinturaCm));
  const naData = (lista, data) => { const p = lista.find(x => x.data === data); return p ? p.y : null; };
  const linhas = [['data', 'peso_kg', 'gordura_pct', 'visceral', 'musculo_kg', 'cintura_cm',
    'massa_gorda_kg', 'massa_magra_kg', 'cintura_altura', 'media4_peso_kg', 'media4_gordura_pct', 'media4_cintura_cm', 'obs']];
  ms.forEach(m => linhas.push([
    dataCsv(m.data), numCsv(m.pesoKg, 2), numCsv(m.gorduraPct, 1), numCsv(m.visceral, 0), numCsv(m.musculoKg, 2), numCsv(m.cinturaCm, 1),
    numCsv(massaGorda(m), 2), numCsv(massaMagra(m), 2), numCsv(relCinturaAltura(m), 3),
    m.pesoKg != null ? numCsv(naData(mmPeso, m.data), 2) : '', m.gorduraPct != null ? numCsv(naData(mmGord, m.data), 1) : '',
    m.cinturaCm != null ? numCsv(naData(mmCint, m.data), 1) : '', m.obs,
  ]));
  return montarCsv(linhas);
}

   9. Ações (cliques) e formulários
   ===================================================================== */
function itemSerie(d) { const it = estado.rascunho.itens[+d.i]; return { it, s: it.series[+d.s] }; }
function passoDe(it) { const ex = exPorId(it.exercicioId); return ex ? ex.passoKg : 2.5; }

// Ao mudar a carga de uma série, as séries seguintes ainda não feitas com a mesma carga acompanham.
function mudarKg(it, j, novo) {
  const antigo = it.series[j].kg;
  it.series[j].kg = novo;
  for (let k = j + 1; k < it.series.length; k++) {
    if (!it.series[k].feita && it.series[k].kg === antigo) it.series[k].kg = novo;
  }
}

const ACOES = {
  'ir': d => ir(d.tela),
  'fechar-flash': () => { ui.flash = null; },
  'fechar-aviso-arm': () => { avisoArmazenamento = null; },
  'cancelar-confirmacao': () => { ui.confirmar = null; },

  // Hoje
  'escolher-treino': d => { ui.treinoEscolhido = d.t; },
  'iniciar-treino': d => { novoRascunho(d.t || ui.treinoEscolhido || proximoTreino()); ui.treinoEscolhido = null; salvar(); ir('treino'); },
  'ver-plano': d => { ui.planoTreino = d.t; ir('plano'); },
  'plano-treino': d => { ui.planoTreino = d.t; },
  // Aula do dia: um toque marca, outro desfaz
  'marcar': d => {
    const h = hojeISO();

  'ver-semana': () => { ui.verSemana = !ui.verSemana; },

  'trocar-perfil': () => { ui.confirmar = 'perfil'; },
  'trocar-perfil-confirmado': d => { ui.confirmar = null; trocarPerfil(d.p); },
  'abrir-form': d => { ui.form = d.f; },
  'fechar-form': () => { ui.form = null; ui.histEditando = null; },

  // Treino
  'kg': d => { const { it, s } = itemSerie(d); mudarKg(it, +d.s, Math.max(0, arred(s.kg + Number(d.d) * passoDe(it)))); salvar(); },
  'reps': d => {
    const { it, s } = itemSerie(d);
    const ex = exPorId(it.exercicioId) || {};
    s.reps = Math.max(0, s.reps + Number(d.d) * passoReps(ex));

/* =====================================================================
   7. Cronômetro de descanso e tela acesa
   ===================================================================== */
let vibrou = false;

function iniciarDescanso() {
  const r = estado.rascunho;
  r.descansoFim = Date.now() + r.descansoS * 1000;
  vibrou = false;
}

function atualizarCronometro() {
  const el = document.getElementById('cronometro');
  const r = estado.rascunho;
  if (!el || !r || !r.descansoFim) return;
  const resta = Math.ceil((r.descansoFim - Date.now()) / 1000);
  if (resta > 0) {
    el.textContent = `${Math.floor(resta / 60)}:${String(resta % 60).padStart(2, '0')}`;
    el.classList.remove('fim');
  } else {
    el.textContent = 'Descanso terminado';
    el.classList.add('fim');
    if (!vibrou) {
      vibrou = true;
      // Só vibra se acabou agora, não ao reabrir o app muito depois
      if (Date.now() - r.descansoFim < 5000 && navigator.vibrate) navigator.vibrate([400, 150, 400]);
    }
  }
}
setInterval(atualizarCronometro, 250);

let travaTela = null, pedindoTrava = false;
async function gerenciarTela() {
  const quer = ui.tela === 'treino' && !!estado.rascunho && estado.config.telaAcesa !== false && document.visibilityState === 'visible';
  try {
    if (quer && !travaTela && !pedindoTrava && 'wakeLock' in navigator) {
      pedindoTrava = true;
      travaTela = await navigator.wakeLock.request('screen');
      travaTela.addEventListener('release', () => { travaTela = null; });
    } else if (!quer && travaTela) {
      await travaTela.release();
      travaTela = null;
    }
  } catch (e) {
    travaTela = null;
  } finally {
    pedindoTrava = false;
  }
}
document.addEventListener('visibilitychange', () => { gerenciarTela(); atualizarCronometro(); });

/* =====================================================================
   8. Exportar e importar
   ===================================================================== */
function carimbo() {
  const d = new Date();
  return `${hojeISO()}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
}

function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Abre o compartilhamento do Android quando o tipo é aceito (CSV); senão baixa (JSON).
async function compartilharOuBaixar(nome, conteudo, tipo) {
  try {
    const arq = new File([conteudo], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      await navigator.share({ files: [arq], title: nome });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  baixar(nome, conteudo, tipo);
  return true;
}

function jsonBackup() {
  const { rascunho, ...dados } = estado;
  return JSON.stringify(dados, null, 2);
}

async function exportarJSON() {
  const ok = await compartilharOuBaixar(`registro-treino-${carimbo()}.json`, jsonBackup(), 'application/json');
  if (ok) {
    estado.ultimoBackup = new Date().toISOString();
    salvar();
    ui.flash = { txt: 'Backup exportado. Guarde o arquivo fora do celular (Drive, e-mail).' };
    render();
  }
}

// CSV para Excel em português: separador ";", vírgula decimal, UTF-8 com BOM
function campoCsv(v) {
  const s = String(v ?? '');
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function numCsv(n, casas) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '';
  return (casas === undefined ? String(arred(n, 2)) : n.toFixed(casas)).replace('.', ',');
}
function dataCsv(s) { const [a, m, d] = s.split('-'); return `${d}/${m}/${a}`; }
function montarCsv(linhas) { return '﻿' + linhas.map(l => l.map(campoCsv).join(';')).join('\r\n') + '\r\n'; }

function csvSeries() {
  const linhas = [['data', 'treino', 'exercicio', 'variacao', 'serie', 'kg', 'reps', 'folga', 'volume_kg']];
  sessoesOrdenadas().forEach(s => s.itens.forEach(it => it.series.forEach((se, j) => {
    linhas.push([dataCsv(s.data), s.treino, it.nome, it.variacao || '', j + 1, numCsv(se.kg), se.reps, se.folga ?? '', numCsv(se.kg * se.reps)]);
  })));
  return montarCsv(linhas);
}

function csvMedidas() {
  const ms = medidasOrdenadas();
  const mmPeso = mediaMovel(serieMedida(m => m.pesoKg));
  const mmGord = mediaMovel(serieMedida(m => m.gorduraPct));
  const mmCint = mediaMovel(serieMedida(m => m.cinturaCm));
  const naData = (lista, data) => { const p = lista.find(x => x.data === data); return p ? p.y : null; };
  const linhas = [['data', 'peso_kg', 'gordura_pct', 'visceral', 'musculo_kg', 'cintura_cm',
    'massa_gorda_kg', 'massa_magra_kg', 'cintura_altura', 'media4_peso_kg', 'media4_gordura_pct', 'media4_cintura_cm', 'obs']];
  ms.forEach(m => linhas.push([
    dataCsv(m.data), numCsv(m.pesoKg, 2), numCsv(m.gorduraPct, 1), numCsv(m.visceral, 0), numCsv(m.musculoKg, 2), numCsv(m.cinturaCm, 1),
    numCsv(massaGorda(m), 2), numCsv(massaMagra(m), 2), numCsv(relCinturaAltura(m), 3),
    m.pesoKg != null ? numCsv(naData(mmPeso, m.data), 2) : '', m.gorduraPct != null ? numCsv(naData(mmGord, m.data), 1) : '',
    m.cinturaCm != null ? numCsv(naData(mmCint, m.data), 1) : '', m.obs,
  ]));
  return montarCsv(linhas);
}

async function lerImportacao(arquivo) {
  try {
    const dados = migrar(JSON.parse(await arquivo.text()), false);
    ui.importPendente = { dados, nome: arquivo.name };
  } catch (e) {
    ui.flash = { txt: 'Não consegui ler o arquivo: ' + (e instanceof SyntaxError ? 'não é um JSON válido.' : e.message), alerta: true };
  }
  render();
}

function confirmarImportacao() {
  // Proteção: baixa os dados atuais antes de substituir
  baixar(`registro-treino-antes-de-importar-${carimbo()}.json`, jsonBackup(), 'application/json');
  estado = ui.importPendente.dados;
  const nome = ui.importPendente.nome;
  ui.importPendente = null;
  salvar();
  ui.flash = { txt: `Dados restaurados de ${nome}. Os dados anteriores foram baixados como backup.` };
}

/* =====================================================================
   9. Ações (cliques) e formulários
   ===================================================================== */
function itemSerie(d) { const it = estado.rascunho.itens[+d.i]; return { it, s: it.series[+d.s] }; }
function passoDe(it) { const ex = exPorId(it.exercicioId); return ex ? ex.passoKg : 2.5; }

// Ao mudar a carga de uma série, as séries seguintes ainda não feitas com a mesma carga acompanham.
function mudarKg(it, j, novo) {
  const antigo = it.series[j].kg;
  it.series[j].kg = novo;
  for (let k = j + 1; k < it.series.length; k++) {
    if (!it.series[k].feita && it.series[k].kg === antigo) it.series[k].kg = novo;
  }
}

const ACOES = {
  'ir': d => ir(d.tela),
  'fechar-flash': () => { ui.flash = null; },
  'fechar-aviso-arm': () => { avisoArmazenamento = null; },
  'cancelar-confirmacao': () => { ui.confirmar = null; },

  // Hoje
  'escolher-treino': d => { ui.treinoEscolhido = d.t; },
  'iniciar-treino': () => { novoRascunho(ui.treinoEscolhido || proximoTreino()); ui.treinoEscolhido = null; salvar(); ir('treino'); },
  'pilates-hoje': () => { const h = hojeISO(); if (!estado.pilates.includes(h)) { estado.pilates.push(h); estado.pilates.sort(); salvar(); } },
  'pilates-desfazer': () => { estado.pilates = estado.pilates.filter(x => x !== hojeISO()); salvar(); },
  'abrir-form': d => { ui.form = d.f; },
  'fechar-form': () => { ui.form = null; ui.histEditando = null; },

  // Treino
  'kg': d => { const { it, s } = itemSerie(d); mudarKg(it, +d.s, Math.max(0, arred(s.kg + Number(d.d) * passoDe(it)))); salvar(); },
  'reps': d => { const { s } = itemSerie(d); s.reps = Math.max(0, s.reps + Number(d.d)); salvar(); },
  'folga': d => { const { s } = itemSerie(d); const v = +d.v; s.folga = s.folga === v ? null : v; salvar(); },
  'feita': d => { const { s } = itemSerie(d); s.feita = !s.feita; if (s.feita) iniciarDescanso(); salvar(); },
  'variacao': d => { estado.rascunho.itens[+d.i].variacao = d.v; salvar(); },
  'mais-serie': d => {
    const it = estado.rascunho.itens[+d.i];
    const ultima = it.series[it.series.length - 1];
    it.series.push({ kg: ultima ? ultima.kg : 0, reps: ultima ? ultima.reps : 8, folga: null, feita: false });
    salvar();
  },
  'descanso-tempo': d => { estado.rascunho.descansoS = +d.v; if (estado.rascunho.descansoFim) iniciarDescanso(); salvar(); },
  'descanso-iniciar': () => { iniciarDescanso(); salvar(); },
  'descanso-parar': () => { estado.rascunho.descansoFim = null; salvar(); },
  'salvar-treino': () => {
    const { feitas, total } = contarSeries(estado.rascunho);
    if (feitas === 0) { ui.flash = { txt: 'Nenhuma série concluída. Marque ao menos uma ou descarte o treino.', alerta: true }; return; }
    if (feitas < total) { ui.confirmar = 'salvar-incompleto'; return; }
    ACOES['salvar-confirmado']();
  },
  'salvar-confirmado': () => {
    if (contarSeries(estado.rascunho).feitas === 0) { ui.confirmar = null; return; }
    const editando = gravarRascunho();
    ui.confirmar = null;
    ui.flash = { txt: editando ? 'Alterações salvas.' : 'Treino salvo.' };
    ir(editando ? 'historico' : 'hoje');
  },
  'descartar-treino': () => { ui.confirmar = 'descartar'; },
  'descartar-confirmado': () => {
    const editando = !!estado.rascunho.editandoId;
    estado.rascunho = null; ui.confirmar = null; salvar();
    ir(editando ? 'historico' : 'hoje');
  },

  // Progresso
  'ponto': d => { ui.leituras[d.g] = +d.p; },

  // Histórico
  'hist-filtro': d => { ui.histFiltro = d.v; ui.histAberto = null; },
  'hist-abrir': d => { ui.histAberto = ui.histAberto === d.k ? null : d.k; ui.histEditando = null; ui.confirmar = null; },
  'hist-editar': d => {
    if (d.k.startsWith('s:')) {
      if (estado.rascunho) { ui.flash = { txt: 'Há um treino em andamento. Salve ou descarte antes de editar outro.', alerta: true }; return; }
      rascunhoDeSessao(estado.sessoes.find(s => s.id === d.k.slice(2)));
      salvar(); ir('treino');
    } else {
      ui.histEditando = d.k;
    }
  },
  'hist-excluir': d => { ui.confirmar = 'hist:' + d.k; },
  'hist-excluir-confirmado': d => {
    const id = d.k.slice(2);
    if (d.k.startsWith('s:')) estado.sessoes = estado.sessoes.filter(s => s.id !== id);
    if (d.k.startsWith('c:')) estado.corridas = estado.corridas.filter(c => c.id !== id);
    if (d.k.startsWith('p:')) estado.pilates = estado.pilates.filter(x => x !== id);
    if (d.k.startsWith('m:')) estado.medidas = estado.medidas.filter(m => m.id !== id);
    ui.confirmar = null; ui.histAberto = null;
    salvar();
    ui.flash = { txt: 'Registro excluído.' };
  },

  // Configurações
  'ex-editar': d => { ui.exEditando = d.id; },
  'ex-cancelar': () => { ui.exEditando = null; },
  'ex-mover': d => {
    const e = exPorId(d.id);
    const grupo = estado.exercicios.filter(x => x.ativo && x.treino === e.treino).sort((a, b) => a.ordem - b.ordem);
    const i = grupo.indexOf(e), j = i + Number(d.d);
    if (j < 0 || j >= grupo.length) return;
    [grupo[i], grupo[j]] = [grupo[j], grupo[i]];
    grupo.forEach((x, k) => { x.ordem = (x.treino === 'AB' ? 100 : 0) + k + 1; });
    salvar();
  },
  'ex-arquivar': d => { exPorId(d.id).ativo = false; ui.exEditando = null; salvar(); ui.flash = { txt: 'Exercício arquivado. O histórico foi mantido.' }; },
  'ex-reativar': d => { exPorId(d.id).ativo = true; salvar(); },
  'cfg-descanso': d => { estado.config.descansoS = +d.v; salvar(); },
  'cfg-tela': d => { estado.config.telaAcesa = d.v === 'true'; salvar(); },
  'exportar-json': () => { exportarJSON(); },
  'exportar-csv-series': () => { compartilharOuBaixar(`treino-series-${carimbo()}.csv`, csvSeries(), 'text/csv'); },
  'exportar-csv-medidas': () => { compartilharOuBaixar(`treino-medidas-${carimbo()}.csv`, csvMedidas(), 'text/csv'); },
  'importar': () => { document.getElementById('arquivo-import').click(); },
  'importar-cancelar': () => { ui.importPendente = null; },
  'importar-confirmado': () => { confirmarImportacao(); },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-acao]');
  if (!el) return;
  const acao = ACOES[el.dataset.acao];
  if (!acao) return;
  ui.flash = null;
  acao(el.dataset, el);
  if (el.dataset.acao !== 'ir') render();
});

// Campos editados à mão (sem redesenhar a cada tecla)
document.addEventListener('change', ev => {
  const el = ev.target;
  const campo = el.dataset && el.dataset.campo;
  if (!campo) return;
  const r = estado.rascunho;
  if (campo === 'kg' || campo === 'reps') {
    // Não redesenha a tela: se o próximo toque for em "Concluir", o botão precisa continuar no lugar.
    const { it, s } = itemSerie(el.dataset);
    const v = lerNumero(el.value);
    if (v !== null && Number.isFinite(v) && v >= 0) {
      if (campo === 'kg') mudarKg(it, +el.dataset.s, arred(v));
      else s.reps = Math.round(v);
      salvar();
    }
    it.series.forEach((se, k) => {
      const sel = `[data-i="${el.dataset.i}"][data-s="${k}"]`;
      const kg = document.querySelector(`input[data-campo="kg"]${sel}`);
      const rp = document.querySelector(`input[data-campo="reps"]${sel}`);
      if (kg) kg.value = fmtKgCampo(se.kg);
      if (rp) rp.value = se.reps;
    });
    return;
  } else if (campo === 'treino-data' && el.value) {
    r.data = el.value; salvar();
  } else if (campo === 'ex-progresso') {
    ui.exProgresso = el.value; ui.leituras.carga = undefined; ui.leituras.volume = undefined;
  }
  render();
});

document.getElementById('arquivo-import').addEventListener('change', ev => {
  const arq = ev.target.files[0];
  ev.target.value = '';
  if (arq) lerImportacao(arq);
});

// Envio de formulários
document.addEventListener('submit', ev => {
  const f = ev.target;
  if (!f.dataset.form) return;
  ev.preventDefault();
  const dados = new FormData(f);
  const erro = msg => { const p = f.querySelector('.erro'); p.textContent = msg; p.hidden = false; };
  const resultado = ({ corrida: salvarCorrida, medidas: salvarMedidas, exercicio: salvarExercicio, altura: salvarAltura })[f.dataset.form](dados, f.dataset.id, erro);
  if (resultado === false) return;
  salvar();
  ui.form = null; ui.histEditando = null; ui.exEditando = null;
  ui.flash = { txt: resultado };
  render();
});

function salvarCorrida(dados, id, erro) {
  const data = dados.get('data');
  const min = lerNumero(dados.get('min'));
  if (!data) return erro('Informe a data.'), false;
  if (min === null || !Number.isFinite(min) || min <= 0 || min > 600) return erro('Informe a duração em minutos.'), false;
  const reg = { data, min: arred(min, 1), formato: dados.get('formato') === 'continua' ? 'continua' : 'alternada', obs: String(dados.get('obs') || '').trim() };
  const existente = id && estado.corridas.find(c => c.id === id);
  if (existente) Object.assign(existente, reg);
  else estado.corridas.push({ id: novoId('c'), ...reg });
  return 'Corrida salva.';
}

function salvarMedidas(dados, id, erro) {
  const data = dados.get('data');
  if (!data) return erro('Informe a data.'), false;
  const reg = { data, obs: String(dados.get('obs') || '').trim() };
  for (const c of CAMPOS_MEDIDA) {
    const v = lerNumero(dados.get(c.k));
    if (v === null) {
      if (c.obrig) return erro(`${c.rotulo} é obrigatório.`), false;
      reg[c.k] = null;
    } else if (!Number.isFinite(v) || v < 0 || v > c.max) {
      return erro(`${c.rotulo}: valor inválido.`), false;
    } else {
      reg[c.k] = arred(v, c.casas);
    }
  }
  let existente = id && estado.medidas.find(m => m.id === id);
  if (!existente) existente = estado.medidas.find(m => m.data === data);  // uma medida por data
  if (existente) { Object.assign(existente, reg); return `Medidas de ${fmtData(data)} atualizadas.`; }
  estado.medidas.push({ id: novoId('m'), ...reg });
  return 'Medidas salvas.';
}

function salvarExercicio(dados, id, erro) {
  const nome = String(dados.get('nome') || '').trim();
  const series = lerNumero(dados.get('series'));
  const repMin = lerNumero(dados.get('repMin'));
  const repMax = lerNumero(dados.get('repMax'));
  const passoKg = lerNumero(dados.get('passoKg'));
  if (!nome) return erro('Informe o nome.'), false;
  if (!Number.isInteger(series) || series < 1 || series > 10) return erro('Séries: de 1 a 10.'), false;
  if (!Number.isInteger(repMin) || !Number.isInteger(repMax) || repMin < 1 || repMax < repMin || repMax > 50) return erro('Faixa de repetições inválida.'), false;
  if (!Number.isFinite(passoKg) || passoKg <= 0 || passoKg > 50) return erro('Passo de carga inválido.'), false;
  const treino = dados.get('treino') || 'A';
  const variacoes = String(dados.get('variacoes') || '').split(',').map(v => v.trim()).filter(Boolean);
  const campos = { nome, treino, series, repMin, repMax, passoKg, variacoes };
  if (id) {
    const e = exPorId(id);
    const mudouGrupo = e.treino !== treino;
    Object.assign(e, campos);
    if (mudouGrupo) e.ordem = proximaOrdem(treino, e.id);
    return 'Exercício atualizado.';
  }
  let base = nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'exercicio';
  let novo = base, n = 2;
  while (exPorId(novo)) novo = `${base}-${n++}`;
  estado.exercicios.push({ id: novo, ...campos, ordem: proximaOrdem(treino), ativo: true });
  return 'Exercício criado.';
}

function proximaOrdem(treino, ignorarId) {
  const ordens = estado.exercicios.filter(e => e.treino === treino && e.id !== ignorarId).map(e => e.ordem);
  return (ordens.length ? Math.max(...ordens) : treino === 'AB' ? 100 : 0) + 1;
}

function salvarAltura(dados, id, erro) {
  const v = lerNumero(dados.get('altura'));
  if (!Number.isFinite(v) || v < 100 || v > 250) return erro('Altura entre 100 e 250 cm.'), false;
  estado.config.alturaCm = arred(v, 1);
  return 'Altura salva.';
}

/* =====================================================================
   10. Rotas e desenho da tela
   ===================================================================== */
const TELAS = { hoje: telaHoje, treino: telaTreino, progresso: telaProgresso, historico: telaHistorico, config: telaConfig };

function ir(tela) {
  if (location.hash.slice(1) === tela) { lerRota(); return; }
  location.hash = tela;
}

function lerRota() {
  let t = location.hash.slice(1);
  if (!TELAS[t]) t = 'hoje';
  if (t === 'treino' && !estado.rascunho) t = 'hoje';
  const mudou = t !== ui.tela;
  ui.tela = t;
  if (mudou) { ui.confirmar = null; ui.form = null; ui.histEditando = null; ui.exEditando = null; }
  render();
  if (mudou) window.scrollTo(0, 0);
}

function render() {
  document.body.dataset.tela = ui.tela;
  document.getElementById('app').innerHTML = TELAS[ui.tela]();
  document.querySelectorAll('nav.abas button').forEach(b => {
    const ativo = b.dataset.tela === ui.tela;
    b.classList.toggle('ativo', ativo);
    if (ativo) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  atualizarCronometro();
  gerenciarTela();
}

window.addEventListener('hashchange', lerRota);
window.addEventListener('storage', ev => { if (ev.key === CHAVE) { estado = carregar(); render(); } });

/* =====================================================================
   11. Início
   ===================================================================== */
if (estado.rascunho && estado.rascunho.descansoFim && estado.rascunho.descansoFim < Date.now()) vibrou = true;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
salvar();   // grava o estado inicial na primeira abertura
lerRota();
</script>
